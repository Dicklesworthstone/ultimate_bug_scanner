name: Checksum Sync

on:
  push:
    branches: ["main"]
    paths:
      - "ubs"
      - "ubs-daemon"
      - "install.sh"
      - "SHA256SUMS"
      - "modules/**"
      - "scripts/new-module.sh"
      - "scripts/update_checksums.py"
      - "scripts/update_checksums.sh"
      - "scripts/update_sha256sums.sh"
      - ".github/workflows/checksum-sync.yml"
  pull_request:
    paths:
      - "ubs"
      - "ubs-daemon"
      - "install.sh"
      - "SHA256SUMS"
      - "modules/**"
      - "scripts/new-module.sh"
      - "scripts/update_checksums.py"
      - "scripts/update_checksums.sh"
      - "scripts/update_sha256sums.sh"
      - ".github/workflows/checksum-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checksum-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify submitted checksums before regeneration
        run: |
          bash scripts/verify_checksums.sh
          bash scripts/verify_sha256sums.sh
      - name: Require canonical generation to leave the tree unchanged
        run: |
          bash scripts/update_checksums.sh
          bash scripts/update_sha256sums.sh
          git diff --exit-code

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Take the current branch, not an older queued push's tree. A later
          # concurrent push is still protected by git's fast-forward check.
          ref: main
          fetch-depth: 1
      - name: Regenerate the complete integrity dependency graph
        run: |
          bash scripts/update_checksums.sh
          bash scripts/update_sha256sums.sh
          bash scripts/verify_checksums.sh
          bash scripts/verify_sha256sums.sh
      - name: Publish generated pins without overwriting concurrent work
        run: |
          set -euo pipefail
          git add -- ubs SHA256SUMS modules/lib/ubs-common.sh modules/ubs-*.sh scripts/new-module.sh
          if git diff --cached --quiet; then
            echo 'All verified-asset and release checksums are current.'
            exit 0
          fi
          # No generator is allowed to leave unstaged edits outside its
          # declared outputs. Do not blindly stage source or tracker files.
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(checksum): synchronize verified asset graph [skip ci]'
          # Reject a moved main rather than force-pushing or reusing hashes
          # computed for different source bytes. A newer push queues its run.
          git push origin HEAD:refs/heads/main
