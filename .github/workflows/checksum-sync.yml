name: Checksum Sync

on:
  push:
    branches: ["main"]
    paths:
      - "ubs"
      - "install.sh"
      - "SHA256SUMS"
      - ".github/workflows/checksum-sync.yml"
      - "test-suite/quality/test_build_output_pruning.py"
  pull_request:
    paths:
      - "ubs"
      - "install.sh"
      - "SHA256SUMS"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checksum-sync-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync-checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Need write access for auto-commit on push to main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Compute current checksums
        id: compute
        run: |
          # Compute actual checksums for both files
          ACTUAL_UBS=$(sha256sum ubs | awk '{print $1}')
          ACTUAL_INSTALL=$(sha256sum install.sh | awk '{print $1}')

          # Extract expected checksums (grep for specific file to avoid multi-line issues)
          EXPECTED_UBS=$(grep '  ubs$' SHA256SUMS 2>/dev/null | awk '{print $1}' || echo "")
          EXPECTED_INSTALL=$(grep '  install.sh$' SHA256SUMS 2>/dev/null | awk '{print $1}' || echo "")

          echo "actual_ubs=$ACTUAL_UBS" >> "$GITHUB_OUTPUT"
          echo "actual_install=$ACTUAL_INSTALL" >> "$GITHUB_OUTPUT"
          echo "expected_ubs=$EXPECTED_UBS" >> "$GITHUB_OUTPUT"
          echo "expected_install=$EXPECTED_INSTALL" >> "$GITHUB_OUTPUT"

          # Check if both match
          if [[ "$ACTUAL_UBS" == "$EXPECTED_UBS" && "$ACTUAL_INSTALL" == "$EXPECTED_INSTALL" ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SHA256SUMS is up to date"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            if [[ "$ACTUAL_UBS" != "$EXPECTED_UBS" ]]; then
              echo "::warning::ubs checksum mismatch (expected $EXPECTED_UBS, actual $ACTUAL_UBS)"
            fi
            if [[ "$ACTUAL_INSTALL" != "$EXPECTED_INSTALL" ]]; then
              echo "::warning::install.sh checksum mismatch (expected $EXPECTED_INSTALL, actual $ACTUAL_INSTALL)"
            fi
          fi

      - name: Verify checksums (PR only)
        if: github.event_name == 'pull_request' && steps.compute.outputs.match == 'false'
        run: |
          echo "::error::SHA256SUMS does not match current files!"
          echo ""
          echo "ubs checksum:"
          echo "  Expected: ${{ steps.compute.outputs.expected_ubs }}"
          echo "  Actual:   ${{ steps.compute.outputs.actual_ubs }}"
          echo ""
          echo "install.sh checksum:"
          echo "  Expected: ${{ steps.compute.outputs.expected_install }}"
          echo "  Actual:   ${{ steps.compute.outputs.actual_install }}"
          echo ""
          echo "Please run: ./scripts/update_checksums.sh"
          exit 1

      - name: Auto-update SHA256SUMS (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compute.outputs.match == 'false'
        run: |
          # Create SHA256SUMS with both entries (install.sh first, then ubs)
          echo "${{ steps.compute.outputs.actual_install }}  install.sh" > SHA256SUMS
          echo "${{ steps.compute.outputs.actual_ubs }}  ubs" >> SHA256SUMS
          echo "Updated SHA256SUMS:"
          cat SHA256SUMS

      - name: Commit and push updated checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compute.outputs.match == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS
          git commit -m "chore(checksum): auto-update SHA256SUMS [skip ci]

          Updated checksums:
            install.sh: ${{ steps.compute.outputs.actual_install }}
            ubs: ${{ steps.compute.outputs.actual_ubs }}

          This commit was automatically generated by the checksum-sync workflow."
          git push

  # One-shot validation for #136. This job does not update any branch; it
  # publishes tested blob objects so the reviewed fix can be committed through
  # the GitHub connector. The final fix restores this workflow unchanged.
  issue-136-validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UBS_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep rsync shellcheck
      - name: Prove the regression fails before the fix
        run: |
          test "$(git hash-object ubs)" = 12b5a2e5f9bd0c66386d1fe776d16a487f472246
          if PYTHONPATH=test-suite/quality python3 -m unittest test_build_output_pruning.BuildOutputListingTest.test_shell_extensions_are_never_build_output -v > "$RUNNER_TEMP/issue-136-before.log" 2>&1; then
            cat "$RUNNER_TEMP/issue-136-before.log"
            echo "Expected the unfixed runner to fail this regression" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/issue-136-before.log"
          grep -q '^FAIL: test_shell_extensions_are_never_build_output' "$RUNNER_TEMP/issue-136-before.log"
      - name: Apply the reviewed traversal patch
        run: |
          cat > "$RUNNER_TEMP/issue-136.patch" <<'PATCH'
          diff --git a/ubs b/ubs
          --- a/ubs
          +++ b/ubs
          @@ -2835,7 +2835,7 @@
               if lang == "bash" and not ext_str:
                   try:
          -            full_path = os.path.join(root, rel_str.encode("utf-8", "replace"))
          +            full_path = os.path.join(root, os.fsencode(rel_str))
                       with open(full_path, "rb") as f:
                           head = f.read(128)
                           if head.startswith(b"#!"):
          @@ -2867,13 +2867,30 @@
               return False
           
           
          +# Cache the exact language-selection predicate, not a second source-extension
          +# table. In particular, Bash entrypoints may have no extension, and contracts
          +# recognize manifests and extensions that SOURCE_EXTENSIONS does not (#136).
          +lang_matches: dict[bytes, tuple[str, ...]] = {}
          +
          +
          +def matching_langs(rel: bytes) -> tuple[str, ...]:
          +    if rel not in lang_matches:
          +        rel_str = os.fsdecode(rel)
          +        name_str = rel_str.rsplit("/", 1)[-1]
          +        ext_str = ext_of(rel.rsplit(b"/", 1)[-1])
          +        lang_matches[rel] = tuple(
          +            lang for lang in all_module_langs
          +            if matches_lang(rel_str, name_str, ext_str, modules_spec.get(lang, {}), lang)
          +        )
          +    return lang_matches[rel]
          +
          +
           # Content-scoped directories (bead B4b). A directory named obj/env/bin is
           # skipped only when its content says it is build output: obj when it holds
           # C# build artefacts (project.assets.json, *.AssemblyInfo.cs, *.nuget.*), env
           # when it is a virtualenv (pyvenv.cfg, bin/activate, Scripts/activate), bin
          -# when no file under it has a source extension. Decisions are cached per
          -# directory; the whole listing is needed for bin, so it is a second pass.
          +# only when no file under it is recognized by ANY shipped scanner (regardless
          +# of --only/--exclude-langs) or the legacy source hints. Decisions are cached
          +# per directory; every automatic prune is reported on stderr, never stdout.
           scoped_cache: dict[bytes, bool] = {}
           
           
          @@ -2898,9 +2915,18 @@
                       os.path.isdir(os.path.join(full, e)) and e.lower() in (b"debug", b"release") for e in entries)
               elif name == b"bin":
          -        verdict = not any(ext_of(f.rsplit(b"/", 1)[-1]) in source_exts for f in files_under)
          +        verdict = not any(
          +            ext_of(rel.rsplit(b"/", 1)[-1]) in source_exts or matching_langs(rel)
          +            for rel in files_under
          +        )
               scoped_cache[dirpath] = verdict
          +    if verdict:
          +        reason = "virtualenv" if name == b"env" else "build output"
          +        print(
          +            f"UBS: skipping {os.fsdecode(dirpath)!r} "
          +            f"(treated as {reason}; {len(files_under)} listed files)",
          +            file=sys.stderr,
          +        )
               return verdict
           
           
          @@ -2981,17 +3007,12 @@
           selected_bytes = 0
           
           for rel in kept:
          -    rel_str = os.fsdecode(rel)
          -    name_str = rel_str.rsplit("/", 1)[-1]
          -    ext_str = ext_of(os.fsencode(name_str))
               is_sel = False
          -    for l in all_module_langs:
          -        spec = modules_spec.get(l, {})
          -        if matches_lang(rel_str, name_str, ext_str, spec, l):
          -            lang_files[l].append(rel)
          -            if l in target_langs:
          -                is_sel = True
          +    for l in matching_langs(rel):
          +        lang_files[l].append(rel)
          +        if l in target_langs:
          +            is_sel = True
               if is_sel:
                   selected_files.add(rel)
                   selected_bytes += kept_sizes.get(rel, 0)
          PATCH
          git apply --recount --check "$RUNNER_TEMP/issue-136.patch"
          git apply --recount "$RUNNER_TEMP/issue-136.patch"
          sha256sum install.sh ubs > SHA256SUMS
      - name: Validate syntax, checksums, and regressions
        run: |
          bash -n ubs
          shellcheck -S warning ubs
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          python3 -m unittest discover -s test-suite/quality -p test_build_output_pruning.py -v
          python3 -m unittest discover -s test-suite/quality -p test_scan_selection.py -v
          git diff --check
          git diff --stat
      - name: Publish tested blob objects without moving main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          for name in ('ubs', 'SHA256SUMS'):
              data = Path(name).read_bytes()
              payload = json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'})
              result = subprocess.run(
                  ['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/git/blobs", '--input', '-'],
                  input=payload, text=True, capture_output=True, check=True, timeout=60,
              )
              blob = json.loads(result.stdout)
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert blob['sha'] == expected, (name, blob)
              print(f"ISSUE136_BLOB {name} {blob['sha']}", flush=True)
          PY
