name: CSharp Project Taint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/csharp-project-taint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-taint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UBS_NO_AUTO_UPDATE: "1"
      UBS_ENABLE_AUTO_UPDATE: "0"
      UBS_SKIP_RUST_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Temporary immutable-blob publication. No refs are changed by this job.
      # The production commit replaces this stage with read-only verification.
      - name: Stage the reviewed selected-project implementation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/csharp-project-publication"
          git rev-parse HEAD > "$RUNNER_TEMP/csharp-project-publication/base-head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/csharp-project-publication/base-source.tar.gz"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          from pathlib import Path
          sha = '21a3d29dd0b2bdf575c354b43827a58bcc791b4b'
          result = subprocess.run(['gh', 'api', f"repos/{os.environ['GH_REPO']}/git/blobs/{sha}"],
              capture_output=True, text=True, check=True, timeout=90)
          data = base64.b64decode(json.loads(result.stdout)['content'])
          def digest(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert digest(data) == sha
          candidate = json.loads(lzma.decompress(data))
          for name, expected in candidate['base'].items():
              assert digest(Path(name).read_bytes()) == expected, ('concurrent source changed', name)
          for name in set(candidate['expected']) - set(candidate['base']):
              assert not Path(name).exists(), ('concurrent addition', name)
          subprocess.run(['git', 'apply', '--check', '-'], input=candidate['patch'], text=True, check=True)
          subprocess.run(['git', 'apply', '-'], input=candidate['patch'], text=True, check=True)
          for name, expected in candidate['expected'].items():
              assert digest(Path(name).read_bytes()) == expected, name
          (Path(os.environ['RUNNER_TEMP']) / 'csharp-project-publication' / 'candidate.json').write_text(json.dumps(candidate), encoding='utf-8')
          PY
      - name: Install real scanner dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq ripgrep rsync shellcheck
      - name: Generate the complete runtime integrity chain
        run: |
          python3 scripts/update_checksums.py > "$RUNNER_TEMP/csharp-project-publication/checksums.log"
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
      - name: Run existing dataflow and selected-project regressions
        run: |
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/csharp-project-publication/tests.log"
          import unittest
          suite = unittest.defaultTestLoader.discover('test-suite/quality', pattern='test_taint_csharp_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun >= 135 and result.wasSuccessful() and not result.skipped, (result.testsRun, result.failures, result.errors, result.skipped)
          print('CSHARP_PROJECT_TESTS_PASS', result.testsRun, flush=True)
          PY
          python3 test-suite/shareable/test_contract_checksums.py -v
      - name: Verify shell syntax and unchanged lint diagnostics
        run: |
          for file in ubs modules/lib/ubs-common.sh modules/ubs-*.sh scripts/new-module.sh; do bash -n "$file"; done
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'csharp-project-lint-base'
          root.mkdir()
          files = ['ubs', 'modules/lib/ubs-common.sh', 'scripts/new-module.sh', *sorted(str(p) for p in Path('modules').glob('ubs-*.sh'))]
          for name in files:
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(subprocess.check_output(['git', 'show', f'HEAD:{name}']))
          def diagnostics(cwd):
              result = subprocess.run(['shellcheck', '-S', 'warning', '-f', 'json', *files], cwd=cwd, capture_output=True, text=True)
              assert result.returncode in (0, 1), (result.returncode, result.stderr)
              return json.loads(result.stdout)
          before, after = diagnostics(root), diagnostics(Path.cwd())
          assert before == after, (before, after)
          print('CSHARP_LINT_UNCHANGED', len(after))
          PY
          git diff --check
      - name: Publish tested source and deterministic integrity blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'csharp-project-publication'
          candidate = json.loads((out / 'candidate.json').read_text())
          functional = set(candidate['expected'])
          allowed = functional | {'ubs', 'SHA256SUMS', 'modules/lib/ubs-common.sh', 'scripts/new-module.sh'}
          allowed.update(str(path) for path in Path('modules').glob('ubs-*.sh'))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) | functional
          assert functional | {'ubs', 'SHA256SUMS', 'modules/lib/ubs-common.sh'} <= changed <= allowed, changed
          snapshots = {name: Path(name).read_bytes() for name in changed}
          subprocess.run(['python3', 'scripts/update_checksums.py'], check=True, stdout=subprocess.DEVNULL)
          assert all(Path(name).read_bytes() == data for name, data in snapshots.items()), 'non-deterministic integrity chain'
          entries = []
          for name, data in sorted(snapshots.items()):
              response = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/git/blobs", '--input', '-'],
                  input=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}), text=True, capture_output=True, check=True, timeout=90)
              sha = json.loads(response.stdout)['sha']
              assert sha == hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()
              mode = mode[0] if mode else '100644'
              entries.append({'path': name, 'sha': sha, 'type': 'blob', 'mode': mode})
              target = out / 'files' / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print('CSHARP_PROJECT_BLOB', name, sha, mode, flush=True)
          (out / 'manifest.json').write_text(json.dumps({'base': (out / 'base-head.txt').read_text().strip(), 'entries': entries}, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csharp-project-publication
          path: ${{ runner.temp }}/csharp-project-publication
          retention-days: 3
