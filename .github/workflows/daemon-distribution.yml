name: Verified Daemon Distribution

on:
  push:
    branches: [main]
    paths:
      - test-suite/patches/daemon-distribution.patch.gz
      - test-suite/patches/daemon-distribution-tests.py.gz
      - test-suite/patches/daemon-install-scope.patch
      - .github/workflows/daemon-distribution.yml
  workflow_dispatch:
    inputs:
      runner:
        description: Validation runner
        type: choice
        options: [ubuntu-24.04-arm, macos-14, ubuntu-latest]
        default: ubuntu-24.04-arm

permissions:
  contents: write

jobs:
  validate:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 25
    env:
      UBS_NO_AUTO_UPDATE: '1'
      UBS_DAEMON_E2E: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scanner dependencies
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bash jq ripgrep rsync shellcheck
            echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
            # Use a physical temporary root so source-identity assertions do
            # not compare /var aliases with their resolved /private paths.
            echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y jq ripgrep rsync shellcheck
          fi
          npm install --global @ast-grep/cli
      - name: Record existing installer and verifier lint diagnostics
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          records = {}
          for name in ('install.sh', 'scripts/verify.sh'):
              result = subprocess.run(['shellcheck', '-S', 'warning', '-f', 'json', name], capture_output=True, text=True)
              assert result.returncode in (0, 1), result.stderr
              records[name] = json.loads(result.stdout)
          Path(os.environ['RUNNER_TEMP'], 'distribution-lint-before.json').write_text(json.dumps(records))
          PY
      - name: Apply exact canonical entrypoint and distribution source
        run: |
          test "$(git hash-object test-suite/patches/daemon-cli.patch)" = c359a29e3c113df1ed8c2d418405a7cab93af477
          test "$(git hash-object test-suite/patches/daemon-cli-tests.py)" = f2284e50b1d2581ea940800484c4234110c248e5
          git apply --check test-suite/patches/daemon-cli.patch
          git apply test-suite/patches/daemon-cli.patch
          cp test-suite/patches/daemon-cli-tests.py test-suite/quality/test_daemon_entrypoint.py
          git apply - <<'PATCH'
          diff --git a/docs/daemon.md b/docs/daemon.md
          --- a/docs/daemon.md
          +++ b/docs/daemon.md
          @@ -19,7 +19,7 @@
           Put the service selector first. Options after it follow the daemon interface:
           `--repo` selects the root, relative files are resolved against that root, and
           `--` protects dash-prefixed filenames. `ubs --client` defaults to JSON and keeps
          -the existing one-shot fallback when no matching service is running. Staged,
          -directory and custom-rule scans still use ordinary `ubs`; unsupported service
          -selection flags are errors, not requests to scan different bytes. Both `ubs`
          +the existing one-shot fallback when no matching service is running. Custom-rule
          +and baseline scans still use ordinary `ubs`; unsupported service policy flags
          +are errors, not requests to scan under different rules. Both `ubs`
           and its matching regular `ubs-daemon` file must be installed together.
          diff --git a/test-suite/quality/test_daemon_entrypoint.py b/test-suite/quality/test_daemon_entrypoint.py
          --- a/test-suite/quality/test_daemon_entrypoint.py
          +++ b/test-suite/quality/test_daemon_entrypoint.py
          @@ -125,8 +125,8 @@
                   for option in ('--format=sarif', '--profile=strict', '--fail-on-warning'):
                       self.assertIn(option, report['args'])
           
          -    def test_unsupported_selection_is_not_silently_changed_to_worktree(self):
          -        result = self.cli('--client', '--staged', '--scanner', str(self.scanner), 'a.py')
          +    def test_unsupported_policy_is_not_silently_discarded(self):
          +        result = self.cli('--client', '--rules=/missing-policy', '--scanner', str(self.scanner), 'a.py')
                   self.assertEqual(result.returncode, 2, result.stderr)
                   self.assertFalse(Path(self.env['SCAN_COUNT']).exists())
           
          PATCH
          test "$(git hash-object test-suite/patches/daemon-distribution.patch.gz)" = df668c2e2d5d6bdbc7385597609cd8422b0e7f16
          test "$(git hash-object test-suite/patches/daemon-distribution-tests.py.gz)" = 275332b37707669ab97104cf36bc75bc2f26ee38
          gzip -dc test-suite/patches/daemon-distribution.patch.gz > "$RUNNER_TEMP/distribution.patch"
          git apply --check "$RUNNER_TEMP/distribution.patch"
          git apply "$RUNNER_TEMP/distribution.patch"
          gzip -dc test-suite/patches/daemon-distribution-tests.py.gz > test-suite/quality/test_daemon_install.py
          test "$(git hash-object test-suite/patches/daemon-install-scope.patch)" = 2a7e54e04f07c3c6033a6e072fc4d84e47d162d7
          git apply --check test-suite/patches/daemon-install-scope.patch
          git apply test-suite/patches/daemon-install-scope.patch
          git add -N test-suite/quality/test_daemon_entrypoint.py test-suite/quality/test_daemon_install.py
          python3 scripts/update_checksums.py
      - name: Exercise service, installer, updater, bundles and agent hooks
        run: |
          set -o pipefail
          python3 -m unittest discover -s test-suite/quality -p 'test_daemon*.py' -v 2>&1 | tee "$RUNNER_TEMP/distribution-service-tests.log"
          python3 -m unittest discover -s test-suite/quality -p test_verified_release.py -v 2>&1 | tee "$RUNNER_TEMP/distribution-release-tests.log"
          python3 -m unittest discover -s test-suite/quality -p test_verified_runtime_bundle.py -v 2>&1 | tee "$RUNNER_TEMP/distribution-bundle-tests.log"
          python3 -m unittest discover -s test-suite/quality -p test_new_module.py -v 2>&1 | tee "$RUNNER_TEMP/distribution-scaffold-tests.log"
          python3 test-suite/install/test_claude_hook_scope.py 2>&1 | tee "$RUNNER_TEMP/distribution-hook-scope-tests.log"
      - name: Enforce unchanged gates and no new installer lint diagnostics
        run: |
          shellcheck -S warning ubs scripts/verify_checksums.sh .claude/hooks/on-file-write.sh
          for name in ubs install.sh scripts/verify.sh scripts/verify_checksums.sh .claude/hooks/on-file-write.sh; do bash -n "$name"; done
          python3 - <<'PY'
          from collections import Counter
          import json, os, subprocess
          from pathlib import Path
          before = json.loads(Path(os.environ['RUNNER_TEMP'], 'distribution-lint-before.json').read_text())
          def diagnostics(items):
              return Counter((item['code'], item['level'], item['message']) for item in items)
          for name, baseline in before.items():
              result = subprocess.run(['shellcheck', '-S', 'warning', '-f', 'json', name], capture_output=True, text=True)
              assert result.returncode in (0, 1), result.stderr
              current = json.loads(result.stdout)
              added = diagnostics(current) - diagnostics(baseline)
              print('LINT_COMPARISON', name, len(baseline), len(current), added, flush=True)
              assert not added, (name, added, current)
          PY
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          git diff --check
      - name: Store verified immutable objects without updating branches or tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          diff = subprocess.check_output(['git', 'diff'])
          subprocess.run(['python3', 'scripts/update_checksums.py'], check=True)
          assert diff == subprocess.check_output(['git', 'diff']), 'Checksum generation is not idempotent'
          subprocess.run(['./scripts/verify_checksums.sh'], check=True)
          subprocess.run(['./scripts/verify_sha256sums.sh'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          allowed = {'ubs', 'install.sh', 'SHA256SUMS', 'scripts/update_checksums.py', 'scripts/verify_checksums.sh',
                     'scripts/verify.sh', 'docs/daemon.md', '.claude/hooks/on-file-write.sh', '.github/workflows/release.yml',
                     'test-suite/quality/test_new_module.py', 'test-suite/quality/test_daemon_entrypoint.py',
                     'test-suite/quality/test_daemon_install.py', 'test-suite/quality/test_verified_release.py',
                     'test-suite/quality/test_verified_runtime_bundle.py', 'test-suite/install/test_claude_hook_scope.py'}
          assert set(changed) == allowed, changed
          records = []
          for name in changed:
              data = Path(name).read_bytes()
              result = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/git/blobs", '--input', '-'],
                                      input=json.dumps({'content': data.decode(), 'encoding': 'utf-8'}), text=True,
                                      capture_output=True, check=True, timeout=90)
              sha = json.loads(result.stdout)['sha']
              assert sha == hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              old = subprocess.run(['git', 'rev-parse', '--verify', 'HEAD:' + name], text=True, capture_output=True)
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              records.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha,
                              'before': old.stdout.strip() if old.returncode == 0 else None})
          manifest = {'base': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'daemon': subprocess.check_output(['git', 'hash-object', 'ubs-daemon'], text=True).strip(), 'files': records}
          Path(os.environ['RUNNER_TEMP'], 'distribution-publication.json').write_text(json.dumps(manifest, indent=2))
          print('DISTRIBUTION_TESTED', json.dumps(manifest), flush=True)
          PY
      - name: Retain exact tested source and diagnostics
        if: always()
        run: |
          git diff > "$RUNNER_TEMP/distribution-final.diff"
          git ls-files -s > "$RUNNER_TEMP/distribution-source-index.txt"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/distribution-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daemon-distribution-validation
          path: ${{ runner.temp }}/distribution-*
          retention-days: 3
