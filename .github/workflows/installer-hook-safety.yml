name: Installer Hook Safety

on:
  push:
    branches: [main]
    paths: [.github/workflows/installer-hook-safety.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer-hooks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep rsync shellcheck
      - name: Apply the reviewed literal installer patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/Dicklesworthstone/ultimate_bug_scanner/git/blobs/6c05aff56e2f33d0cd9ef40122f8c28646d51c7a --jq .content | base64 -d > "$RUNNER_TEMP/installer.patch"
          git apply --recount --check "$RUNNER_TEMP/installer.patch"
          git apply --recount "$RUNNER_TEMP/installer.patch"
          ./scripts/update_sha256sums.sh
      - name: Check syntax, lint, and checksum chain
        run: |
          bash -n install.sh
          bash -n test-suite/install/run_tests.sh
          shellcheck -S warning install.sh
          ./scripts/verify_sha256sums.sh
          ./scripts/verify_checksums.sh
      - name: Exercise hook scope and real sandboxed HOME install
        run: python3 test-suite/install/test_claude_hook_scope.py -v
      - name: Publish tested Git objects without moving any branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(endpoint, payload):
              result = subprocess.run(['gh', 'api', '--method', 'POST', endpoint, '--input', '-'], input=json.dumps(payload), text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          changed = git('diff', '--name-only').splitlines()
          allowed = {'install.sh', 'SHA256SUMS', 'test-suite/install/run_tests.sh'}
          if set(changed) != allowed:
              raise SystemExit(f'Unexpected changed paths: {changed}')
          endpoint = 'repos/Dicklesworthstone/ultimate_bug_scanner/git/'
          entries = []
          for path in changed:
              mode = git('ls-files', '-s', '--', path).split()[0]
              sha = api(endpoint + 'blobs', {'encoding':'base64', 'content':base64.b64encode(Path(path).read_bytes()).decode()})['sha']
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          tree = api(endpoint + 'trees', {'base_tree':git('rev-parse', 'HEAD^{tree}'), 'tree':entries})['sha']
          result = {'base_commit':git('rev-parse','HEAD'),'tree_sha':tree,'paths':changed}
          Path(os.environ['RUNNER_TEMP'], 'installer-tree.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
          git diff > "$RUNNER_TEMP/installer-runtime.diff"
      - name: Preserve tested source and verification evidence
        if: always()
        run: |
          tar -czf "$RUNNER_TEMP/installer-source.tar.gz" install.sh ubs VERSION SHA256SUMS .claude/hooks scripts test-suite/install modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-hook-verification
          path: |
            ${{ runner.temp }}/installer-source.tar.gz
            ${{ runner.temp }}/installer-runtime.diff
            ${{ runner.temp }}/installer-tree.json
          if-no-files-found: ignore
