name: JavaScript Heap Shapes and Native Identity

on:
  push:
    branches: [main]
    paths:
      - test-suite/patches/javascript-heap-shapes.patch.xz
      - test-suite/patches/javascript-native-identity.patch.xz
      - test-suite/patches/javascript-native-exports.patch.xz
      - test-suite/patches/javascript-heap-templates.patch.xz
      - .github/workflows/javascript-heap-shapes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shape-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Publish immutable tested blobs only. Never commits, branches, or tags.
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UBS_NO_AUTO_UPDATE: '1'
      UBS_HEAP_E2E: '1'
      UBS_TAINT_E2E: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retain exact current source and verify the existing integrity chain
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/js-shapes-source-head.txt"
          git ls-files -s > "$RUNNER_TEMP/js-shapes-source-index.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/js-shapes-source.tar.gz"
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-shapes-current-source
          path: ${{ runner.temp }}/js-shapes-source*
          retention-days: 3
      - name: Apply exact reviewed shape, identity and scheduled-summary increments
        run: |
          python3 - <<'PY'
          import hashlib
          import lzma
          from pathlib import Path
          import subprocess
          def blob(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          source = 'modules/helpers/ubs_core/analyzers/taint_js.py'
          tests = 'test-suite/js/test_taint_heap.py'
          stages = [
              ('javascript-heap-shapes.patch.xz', 'd0e155c96c5ca90ad940430bcf2d428105368124785ed249c333bef6fc2b6328',
               '51c808a84550093b8368571aba022d938c9ff380', '9a9d33f718f58312f31a51d52d31f55354b64fcd'),
              ('javascript-native-identity.patch.xz', '85bad85ebb7e10d52fb313bc5747d0248b481d3ea9132d9bc331180abadc5522',
               'f4e5997341da1547df687519ae9351bc196db879', 'a23f335861108e946d825373efec2a3802d84516'),
              ('javascript-native-exports.patch.xz', '3eb47660f1a7e36cf19ab3a489573c11202d42d238c329512a8fccdc4c0420d4',
               '80a90b9772d16f85db17b0f6838b716d53a0fc63', 'e655e6787428e83b78594faac894b3d1f1f25237'),
          ]
          def apply(filename, digest):
              patch = lzma.decompress(Path('test-suite/patches',filename).read_bytes())
              assert hashlib.sha256(patch).hexdigest() == digest, filename
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
          if blob(source) == '3b5a601ab85dcccc0aabc67d8c0e2be4140fa208':
              for filename, digest, source_sha, test_sha in stages:
                  apply(filename, digest)
                  assert blob(source) == source_sha and blob(tests) == test_sha, filename
          # The preceding exact candidate may have been activated meanwhile.
          # Never replace a newer or unrecognized implementation.
          assert blob(source) == '80a90b9772d16f85db17b0f6838b716d53a0fc63'
          assert blob(tests) == 'e655e6787428e83b78594faac894b3d1f1f25237'
          apply('javascript-heap-templates.patch.xz', '63da65df02dd0f59a81ed3945b3cad5d6ea86d1df5c02ecf8a375d11e5858973')
          assert blob(source) == '488c7605f2693fc4268b1bfc184b9e7f0efff726'
          assert blob('test-suite/quality/test_taint_js_heap.py') == 'd66a1ed2161ad4b0f9c202a8e2474eb665403d1b'
          print('JS_SHAPES_BASE',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
          PY
          python3 scripts/update_checksums.py
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          git diff --check
      - name: Install actual scanner and independent semantic controls
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep rsync shellcheck
          npm install --global @ast-grep/cli typescript@5.8.3
      - name: Run all source taint regressions and native scanner cases without skips
        run: |
          command -v ast-grep
          command -v node
          command -v tsc
          python3 - <<'PY'
          import importlib.util
          import unittest
          suite = unittest.defaultTestLoader.discover('test-suite/js',pattern='test_taint*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped, (result.failures,result.errors,result.skipped)
          print('JS_SHAPES_SOURCE_PASS',result.testsRun,flush=True)
          for path in ('test-suite/quality/test_taint_js_modules.py',
                       'test-suite/quality/test_taint_js_commonjs.py',
                       'test-suite/quality/test_taint_js_heap.py'):
              spec = importlib.util.spec_from_file_location('regressions',path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
              assert result.wasSuccessful() and not result.skipped, (path,result.failures,result.errors,result.skipped)
              print('JS_SHAPES_TEST_PASS',path,result.testsRun,flush=True)
          PY
      - name: Preserve production JavaScript and shell quality gates
        run: |
          python3 -m unittest discover -s test-suite/quality -p '*js*.py' -v
          shellcheck -S warning ubs modules/ubs-*.sh scripts/new-module.sh
          for file in ubs modules/ubs-*.sh modules/lib/ubs-common.sh scripts/new-module.sh; do bash -n "$file"; done
      - name: Verify deterministic integrity and publish tested immutable objects
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile
          import urllib.request
          changed = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          required = {'modules/helpers/ubs_core/analyzers/taint_js.py','test-suite/quality/test_taint_js_heap.py'}
          allowed = required | {'test-suite/js/test_taint_heap.py','ubs','SHA256SUMS','modules/lib/ubs-common.sh','scripts/new-module.sh'}
          allowed.update(str(path) for path in Path('modules').glob('ubs-*.sh'))
          assert required <= set(changed) <= allowed, changed
          before = {name:Path(name).read_bytes() for name in changed}
          subprocess.run(['python3','scripts/update_checksums.py'],check=True)
          assert changed == subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(Path(name).read_bytes() == data for name,data in before.items())
          for command in (['./scripts/verify_checksums.sh'],['./scripts/verify_sha256sums.sh'],['git','diff','--check']):
              subprocess.run(command,check=True)
          manifest = []
          with tarfile.open(Path(os.environ['RUNNER_TEMP'],'js-shapes-verified.tar.gz'),'w:gz') as archive:
              for name,data in before.items():
                  sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  mode = subprocess.check_output(['git','ls-files','-s','--',name],text=True).split()[0]
                  assert mode in {'100644','100755'}
                  manifest.append({'path':name,'sha':sha,'mode':mode})
                  archive.add(name,arcname=name)
          Path(os.environ['RUNNER_TEMP'],'js-shapes-verified.json').write_text(json.dumps(manifest,indent=2))
          for entry in manifest:
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GH_REPO'] + '/git/blobs',
                  data=json.dumps({'encoding':'base64','content':base64.b64encode(before[entry['path']]).decode('ascii')}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=90) as response:
                  result=json.load(response)
              assert result['sha'] == entry['sha'],entry['path']
              print('JS_SHAPES_OBJECT',entry['path'],entry['sha'],entry['mode'],flush=True)
          print('JS_SHAPES_BASE',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-heap-shapes-validation
          path: |
            ${{ runner.temp }}/js-shapes-verified*
            test-suite/artifacts/javascript-heap-shapes/
            test-suite/artifacts/javascript-call-completions/
            test-suite/artifacts/javascript-modules/
            test-suite/artifacts/javascript-commonjs/
            test-suite/artifacts/javascript-heap/
          retention-days: 3
