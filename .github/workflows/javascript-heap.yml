name: JavaScript Heap Taint

on:
  push:
    branches: [main]
    paths:
      - ubs
      - modules/ubs-js.sh
      - modules/lib/ubs-common.sh
      - modules/helpers/ubs_core/**
      - test-suite/quality/*js*.py
      - test-suite/js/test_taint_domains.py
      - test-suite/js/test_taint_scopes.py
      - test-suite/js/test_taint_effects.py
      - .github/workflows/javascript-heap.yml
  workflow_dispatch:
    inputs:
      runner:
        description: Supported runner pool for the unchanged validation gates
        type: choice
        options: [ubuntu-latest, macos-15]
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  heap-regressions:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UBS_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retain exact production source for independent reproduction
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/js-heap-source-head.txt"
          git ls-files --stage > "$RUNNER_TEMP/js-heap-source-index.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/js-heap-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: js-heap-source
          path: ${{ runner.temp }}/js-heap-source*
          retention-days: 3
      - name: Install actual scanner dependencies before Bash integrity gates
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bash jq ripgrep shellcheck gnu-time
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix gnu-time)/libexec/gnubin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y bash jq ripgrep rsync shellcheck time
          fi
          npm install --global @ast-grep/cli
      - name: Verify the committed production integrity chain
        run: |
          bash -c 'test "$BASH_VERSINFO" -ge 5'
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          git diff --check
      - name: Run every discovered heap regression with real scanner dependencies
        run: |
          command -v ast-grep
          command -v node
          python3 - <<'PY'
          import importlib.util
          import unittest
          path = 'test-suite/quality/test_taint_js_heap.py'
          spec = importlib.util.spec_from_file_location('heap_regressions', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          expected = suite.countTestCases()
          assert expected >= 119, f'heap tests disappeared: {expected}'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == expected, (result.testsRun, expected)
          assert result.wasSuccessful() and not result.skipped, (result.failures, result.errors, result.skipped)
          print('JS_HEAP_TESTS_PASS', result.testsRun, flush=True)
          PY
      - name: Run recursive caller isolation, exceptions, cycles and sanitizer regressions
        run: python3 test-suite/quality/test_taint_js_recursive_contexts.py -v
      - name: Run existing production taint and JavaScript quality suites
        run: |
          python3 test-suite/js/test_taint_domains.py
          python3 test-suite/js/test_taint_scopes.py
          python3 test-suite/js/test_taint_effects.py
          python3 -m unittest discover -s test-suite/quality -p '*js*.py' -v
          shellcheck -S warning ubs modules/ubs-*.sh scripts/new-module.sh
          for file in ubs modules/ubs-*.sh modules/lib/ubs-common.sh scripts/new-module.sh; do bash -n "$file"; done
      - name: Verify byte-identical production checksum regeneration
        run: |
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          python3 scripts/update_checksums.py
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-heap-validation
          path: |
            test-suite/artifacts/javascript-heap/
            test-suite/artifacts/js-recursive-interpreter/
            test-suite/artifacts/js-heap-expansion/
            test-suite/artifacts/c6-*/
          retention-days: 3
