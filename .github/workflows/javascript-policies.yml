name: JavaScript Policy Coverage

on:
  push:
    branches: [main]
    paths:
      - ubs
      - modules/**
      - test-suite/quality/test_js_*.py
      - test-suite/shareable/test_status_invariants.py
      - .github/workflows/javascript-policies.yml
  pull_request:
    paths:
      - ubs
      - modules/**
      - test-suite/quality/test_js_*.py
      - test-suite/shareable/test_status_invariants.py
      - .github/workflows/javascript-policies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UBS_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install real analyzers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq ripgrep rsync shellcheck
          npm install --global @ast-grep/cli@0.45.3
      - name: Apply the immutable reviewed completeness candidate
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'prepare JavaScript completeness candidate')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          chunks = []
          for sha in ('5d382ff68c3cca13e7ff577afc48337435805ee3',
                      '2388a4664f09ca5169caf741274e72324d3aef1c',
                      'f0406dd75e8d532f30deb56cb4fd50419eca3264'):
              result = subprocess.run(['gh', 'api', '-H',
                  'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0',
                  f"repos/{os.environ['GH_REPO']}/git/blobs/{sha}"],
                  capture_output=True, text=True, check=True, timeout=60)
              data = base64.b64decode(json.loads(result.stdout)['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          data = b''.join(chunks)
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == 'b272fc4c1a3af74c232de4a199953c02ebf78b47'
          patch = Path(os.environ['RUNNER_TEMP'], 'js-completeness.patch')
          patch.write_bytes(gzip.decompress(data))
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          PY
          python3 scripts/update_checksums.py > "$RUNNER_TEMP/js-checksum-update.log"
          git add -- ubs SHA256SUMS modules/lib/ubs-common.sh modules/ubs-*.sh scripts/new-module.sh
      - name: Verify source and checksum integrity
        run: |
          for source in ubs modules/lib/ubs-common.sh modules/ubs-*.sh; do bash -n "$source"; done
          shellcheck -S warning ubs modules/ubs-js.sh
          ./scripts/verify_checksums.sh > "$RUNNER_TEMP/js-checksums.log"
          ./scripts/verify_sha256sums.sh
          python3 scripts/update_checksums.py > "$RUNNER_TEMP/js-checksum-repeat.log"
          git diff --exit-code
          git diff --cached --check
      - name: Exercise policies, cache, real analyzers and traversal
        run: |
          cd test-suite
          python3 -m unittest quality.test_js_rules quality.test_js_scan quality.test_bash_scan quality.test_cache quality.test_build_output_pruning quality.test_scan_selection quality.test_module_file_counting -v 2>&1 | tee "$RUNNER_TEMP/js-policy-tests.log"
      - name: Exercise partial reports and optional analyzer adapters
        run: |
          python3 test-suite/shareable/test_optional_analyzers.py -v 2>&1 | tee "$RUNNER_TEMP/js-optional-tests.log"
          python3 test-suite/shareable/test_ruby_analyzers.py -v 2>&1 | tee "$RUNNER_TEMP/js-ruby-tests.log"
          python3 test-suite/shareable/test_go_analyzers.py -v 2>&1 | tee "$RUNNER_TEMP/js-go-tests.log"
          python3 test-suite/shareable/test_status_invariants.py 2>&1 | tee "$RUNNER_TEMP/js-status-tests.log"
      - name: Store tested source objects without changing any branch
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'prepare JavaScript completeness candidate')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert paths and all(not name.startswith('.github/') for name in paths)
          entries = []
          for name in paths:
              data = Path(name).read_bytes()
              result = subprocess.run(['gh', 'api', '--method', 'POST', '-H',
                  'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0',
                  f"repos/{os.environ['GH_REPO']}/git/blobs", '--input', '-'],
                  input=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}),
                  capture_output=True, text=True, check=True, timeout=60)
              sha = json.loads(result.stdout)['sha']
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              mode = subprocess.check_output(['git', 'ls-files', '--stage', '--', name], text=True).split()[0]
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          manifest = {'parent': os.environ['GITHUB_SHA'], 'files': entries}
          Path(os.environ['RUNNER_TEMP'], 'js-candidate.json').write_text(json.dumps(manifest, indent=2))
          print('JS_CANDIDATE', json.dumps(manifest))
          PY
      - name: Pin the validated landed module version
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'fix(scan-completeness):')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(cat VERSION)" = 5.4.13
          endpoint="repos/$GH_REPO/git/ref/tags/v5.4.13"
          if existing="$(gh api -H 'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0' "$endpoint" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api -H 'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0' --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/v5.4.13 -f sha="$GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-completeness-validation
          path: |
            ${{ runner.temp }}/js-*.log
            ${{ runner.temp }}/js-candidate.json
          retention-days: 7
