name: JavaScript Policy Coverage

on:
  push:
    branches: [main]
    paths:
      - ubs
      - SHA256SUMS
      - modules/**
      - scripts/update_checksums.py
      - test-suite/quality/test_js_*.py
      - test-suite/quality/test_bash_scan.py
      - test-suite/quality/test_cache.py
      - test-suite/quality/test_build_output_pruning.py
      - test-suite/quality/test_scan_selection.py
      - test-suite/quality/test_module_file_counting.py
      - test-suite/shareable/test_*analyzers.py
      - test-suite/shareable/test_status_invariants.py
      - .github/workflows/javascript-policies.yml
  pull_request:
    paths:
      - ubs
      - SHA256SUMS
      - modules/**
      - scripts/update_checksums.py
      - test-suite/quality/test_js_*.py
      - test-suite/quality/test_bash_scan.py
      - test-suite/quality/test_cache.py
      - test-suite/quality/test_build_output_pruning.py
      - test-suite/quality/test_scan_selection.py
      - test-suite/quality/test_module_file_counting.py
      - test-suite/shareable/test_*analyzers.py
      - test-suite/shareable/test_status_invariants.py
      - .github/workflows/javascript-policies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UBS_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install real analyzers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq ripgrep rsync shellcheck
          npm install --global @ast-grep/cli@0.45.3
      - name: Verify source and checksum integrity
        run: |
          for source in ubs modules/lib/ubs-common.sh modules/ubs-*.sh; do bash -n "$source"; done
          shellcheck -S warning ubs modules/ubs-js.sh
          ./scripts/verify_checksums.sh > "$RUNNER_TEMP/js-checksums.log"
          ./scripts/verify_sha256sums.sh
          python3 scripts/update_checksums.py > "$RUNNER_TEMP/js-checksum-repeat.log"
          git diff --exit-code
      - name: Exercise policies, cache, real analyzers and traversal
        run: |
          cd test-suite
          python3 -m unittest quality.test_js_rules quality.test_js_scan quality.test_bash_scan quality.test_cache quality.test_build_output_pruning quality.test_scan_selection quality.test_module_file_counting -v 2>&1 | tee "$RUNNER_TEMP/js-policy-tests.log"
      - name: Exercise partial reports and optional analyzer adapters
        run: |
          python3 test-suite/shareable/test_optional_analyzers.py -v 2>&1 | tee "$RUNNER_TEMP/js-optional-tests.log"
          python3 test-suite/shareable/test_ruby_analyzers.py -v 2>&1 | tee "$RUNNER_TEMP/js-ruby-tests.log"
          python3 test-suite/shareable/test_go_analyzers.py -v 2>&1 | tee "$RUNNER_TEMP/js-go-tests.log"
          python3 test-suite/shareable/test_status_invariants.py 2>&1 | tee "$RUNNER_TEMP/js-status-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-completeness-validation
          path: ${{ runner.temp }}/js-*.log
          retention-days: 7

  pin-tested-assets:
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci: pin validated 5.4.13 assets')
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and pin the exact tested production commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          sha = '511a93b79e84ec55a9047fc3465e456a77581a0d'
          expected_tree = 'a827831ff10451d5c7e425e0105feb87f229b030'
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)
          assert subprocess.check_output(['git', 'rev-parse', sha + '^{tree}'], text=True).strip() == expected_tree
          assert subprocess.check_output(['git', 'show', sha + ':VERSION'], text=True).strip() == '5.4.13'
          prefix = ['gh', 'api', '-H', 'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0']
          base = 'repos/' + os.environ['GH_REPO'] + '/git/'
          endpoint = base + 'ref/tags/v5.4.13'
          current = subprocess.run(prefix + [endpoint], capture_output=True, text=True, timeout=60)
          if current.returncode == 0:
              assert json.loads(current.stdout)['object']['sha'] == sha, 'Existing tag differs; refusing to replace it'
          else:
              assert str(json.loads(current.stdout).get('status')) == '404', current.stderr
              subprocess.run(prefix + ['--method', 'POST', base + 'refs',
                  '-f', 'ref=refs/tags/v5.4.13', '-f', 'sha=' + sha], check=True, timeout=60)
          verified = subprocess.check_output(prefix + [endpoint], text=True, timeout=60)
          assert json.loads(verified)['object']['sha'] == sha
          print('Verified v5.4.13 points to the tested production commit ' + sha)
          PY
