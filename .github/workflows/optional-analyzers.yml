name: Optional Analyzer Coverage

on:
  push:
    branches: [main]
    paths:
      - ubs
      - SHA256SUMS
      - modules/**
      - scripts/new-module.sh
      - scripts/update_checksums.py
      - scripts/verify_checksums.sh
      - scripts/verify_sha256sums.sh
      - test-suite/shareable/test_optional_analyzers.py
      - test-suite/shareable/test_ruby_analyzers.py
      - test-suite/shareable/test_go_analyzers.py
      - test-suite/quality/test_cache.py
      - test-suite/quality/test_scan_selection.py
      - test-suite/quality/test_module_file_counting.py
      - .github/workflows/optional-analyzers.yml
  pull_request:
    paths:
      - ubs
      - SHA256SUMS
      - modules/**
      - scripts/new-module.sh
      - scripts/update_checksums.py
      - scripts/verify_checksums.sh
      - scripts/verify_sha256sums.sh
      - test-suite/shareable/test_optional_analyzers.py
      - test-suite/shareable/test_ruby_analyzers.py
      - test-suite/shareable/test_go_analyzers.py
      - test-suite/quality/test_cache.py
      - test-suite/quality/test_scan_selection.py
      - test-suite/quality/test_module_file_counting.py
      - .github/workflows/optional-analyzers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-analyzers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq ripgrep rsync shellcheck
          go version
          command -v gofmt
      - name: Verify syntax, lint, and checksum chain
        run: |
          for script in ubs modules/lib/ubs-common.sh modules/ubs-*.sh; do bash -n "$script"; done
          shellcheck -S warning ubs modules/ubs-bash.sh modules/ubs-ruby.sh modules/ubs-golang.sh
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
      - name: Test Go tools, real offline vet, and production reports
        run: python3 test-suite/shareable/test_go_analyzers.py -v
      - name: Test Ruby tools across output, scope, and cache paths
        run: python3 test-suite/shareable/test_ruby_analyzers.py -v
      - name: Test existing external coverage and reports
        run: python3 test-suite/shareable/test_optional_analyzers.py -v
      - name: Test existing cache, selection, and file-counting behavior
        run: |
          cd test-suite
          python3 -m unittest quality.test_cache quality.test_scan_selection quality.test_module_file_counting -v
      - name: Verify checksum regeneration is stable
        run: |
          python3 scripts/update_checksums.py
          git diff --exit-code

  # Temporary full-checkout validation, removed in the tested candidate.
  # Main is updated only through the connector after the result is reviewed.
  issue-135-validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'validate issue 135')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UBS_NO_AUTO_UPDATE: "1"
    steps:
      - name: Stop the superseded validation candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          endpoint="repos/$GH_REPO/actions/runs/35642948214"
          ua='User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0'
          if ! gh api --method POST -H "$ua" "$endpoint/cancel"; then
            test "$(gh api -H "$ua" "$endpoint" --jq .status)" = completed
          fi
          for attempt in $(seq 1 30); do
            status="$(gh api -H "$ua" "$endpoint" --jq .status)"
            if test "$status" = completed; then break; fi
            sleep 2
          done
          test "$status" = completed
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq ripgrep rsync shellcheck python3-yaml
          npm install --global @ast-grep/cli
      - name: Reuse the exact reviewed patch and baseline procedure
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import yaml
          # This immutable commit contains the manually reviewed patch, not
          # instructions from an issue comment, PR, or external branch.
          raw = subprocess.check_output([
              'git', 'show', 'ffc1d3a5e941a5fd50b738ddfa80d8626b698657:.github/workflows/optional-analyzers.yml'
          ], text=True)
          steps = yaml.safe_load(raw)['jobs']['issue-135-validation']['steps']
          scripts = {step['name']: step['run'] for step in steps if 'run' in step}
          Path(os.environ['RUNNER_TEMP'], 'issue135-reviewed-steps.json').write_text(json.dumps(scripts))
          for name in ('Verify the current source and reproduce the report',
                       'Apply the reviewed operand and regression patch'):
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', scripts[name]], check=True)
          PY
          PYTHONPATH=modules/helpers python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from ubs_core.analyzers.ctcompare_js import scan_file
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 'continued.ts'
              path.write_text('if (expectedSignature\n !== actualSignature) return false;\n')
              assert scan_file(path, Path(tmp)) == []
          print('REPRODUCED leading-operator gap in the first candidate')
          PY
      - name: Preserve leading-operator comparisons and precise line ownership
        run: |
          cat > "$RUNNER_TEMP/issue135-continuations.patch" <<'PATCH'
          --- a/modules/helpers/ubs_core/analyzers/ctcompare_js.py
          +++ b/modules/helpers/ubs_core/analyzers/ctcompare_js.py
          @@ -372,12 +372,14 @@
                       yield comparison.start(), left, right
           
           
          -def unsafe_secret_compare(statement, sensitive_vars, *, comparison_limit=None):
          +def unsafe_secret_compare(statement, sensitive_vars, *, comparison_start=0, comparison_limit=None):
               if safe_compare_re.search(statement) or 'ubs:ignore' in statement:
                   return False
               # Match within each term, never across &&/||. An exempt comparison only
               # exempts that term; later terms may still compare actual secret values.
               for offset, left, right in comparison_operands(statement):
          +        if offset < comparison_start:
          +            continue
                   if comparison_limit is not None and offset >= comparison_limit:
                       continue
                   if unsafe_secret_operands(left, right, sensitive_vars):
          @@ -432,11 +434,20 @@
                   stripped = code_line(raw).strip()
                   if not stripped or has_ignore(lines, idx) or ('==' not in stripped and '!=' not in stripped):
                       continue
          -        statement = statement_from(lines, idx)
          +        prefix = ''
          +        if compare_re.match(stripped):
          +            # An operator may start a continuation line. Recover its real left
          +            # operand, but do not re-report comparisons from the prefix.
          +            start = statement_start(lines, idx)
          +            prefix = ' '.join(code_line(line).strip() for line in lines[start:idx])
          +            if prefix:
          +                prefix += ' '
          +        statement = prefix + statement_from(lines, idx)
                   # Lookahead completes a multiline operand, but a comparison on a later
                   # physical line must be reported there, not on this line as well.
                   if not statement or not unsafe_secret_compare(
          -            statement, sensitive_vars, comparison_limit=len(stripped)
          +            statement, sensitive_vars, comparison_start=len(prefix),
          +            comparison_limit=len(prefix) + len(stripped)
                   ):
                       continue
                   if idx in seen_lines:
          @@ -690,6 +701,25 @@
               assert all(f["rule"] == "javascript.ctcompare.unsafe_secret_compare" for f in findings)
           
           
          +def _selftest_leading_operator_continuations() -> None:
          +    for operator in ('===', '!==', '==', '!='):
          +        source = f'''if (expectedSignature
          +    {operator} actualSignature) return false;
          +const matches = expectedSignature
          +    {operator} supplied;
          +if (!isValidSecret(secret) || typeof envelope
          +    {operator} "string") return false;
          +if (expectedSignature !== actualSignature &&
          +    expectedSignature.length
          +    {operator} 32) return false;
          +'''
          +        with tempfile.TemporaryDirectory(prefix="ubs_core_ctcompare_js_") as tmp:
          +            target = Path(tmp) / "continued.ts"
          +            target.write_text(source, encoding="utf-8")
          +            findings = list(run(RunContext(lang="javascript", files=[target])))
          +        assert [f["line"] for f in findings] == [2, 4, 7], (operator, findings)
          +
          +
           SELF_TESTS: tuple[tuple[str, callable], ...] = (
               ("positive_detects_secret_compare", _selftest_positive),
               ("ubs_ignore_suppresses", _selftest_suppression),
          @@ -703,6 +733,7 @@
               ("issue_135_envelope_guard_is_clean", _selftest_envelope_guard_regression),
               ("nested_boolean_operands_keep_their_secrets", _selftest_nested_boolean_operands),
               ("multiline_boolean_findings_keep_their_line", _selftest_multiline_boolean_locations),
          +    ("leading_operator_continuations_keep_the_left_operand", _selftest_leading_operator_continuations),
           )
           
           register(Analyzer(layer="ctcompare", lang="javascript", name="ctcompare_js", run=run, selftests=SELF_TESTS))
          PATCH
          git apply --check "$RUNNER_TEMP/issue135-continuations.patch"
          git apply "$RUNNER_TEMP/issue135-continuations.patch"
          echo '462e601e16b1359711b50c241fab8911157f5efa341eba533c4519a2464ce04f  modules/helpers/ubs_core/analyzers/ctcompare_js.py' | sha256sum -c -
      - name: Keep the version pin immutable and regenerate all checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing="$(gh api -H 'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0' "repos/$GH_REPO/git/matching-refs/tags/v5.4.10" --jq '.[] | select(.ref == "refs/tags/v5.4.10") | .ref')"
          if test -n "$existing"; then
            cat > "$RUNNER_TEMP/issue135-next-version.patch" <<'PATCH'
          --- a/VERSION
          +++ b/VERSION
          @@ -1 +1 @@
          -5.4.10
          +5.4.11
          --- a/ubs
          +++ b/ubs
          @@ -31 +31 @@
          -UBS_VERSION="5.4.10"
          +UBS_VERSION="5.4.11"
          --- a/README.md
          +++ b/README.md
          @@ -12 +12 @@
          -[![Version](https://img.shields.io/badge/version-5.4.10-blue.svg)](https://github.com/Dicklesworthstone/ultimate_bug_scanner)
          +[![Version](https://img.shields.io/badge/version-5.4.11-blue.svg)](https://github.com/Dicklesworthstone/ultimate_bug_scanner)
          PATCH
            git apply --unidiff-zero --check "$RUNNER_TEMP/issue135-next-version.patch"
            git apply --unidiff-zero "$RUNNER_TEMP/issue135-next-version.patch"
          fi
          ./scripts/update_checksums.sh
      - name: Gate on all 13 analyzer tests, syntax, and integrity
        run: |
          PYTHONPATH=modules/helpers python3 - <<'PY'
          import ast
          from pathlib import Path
          from ubs_core.analyzers.ctcompare_js import SELF_TESTS
          ast.parse(Path('modules/helpers/ubs_core/analyzers/ctcompare_js.py').read_text())
          for name, test in SELF_TESTS:
              test()
              print('PASS', name)
          assert len(SELF_TESTS) == 13
          print('ISSUE135_TARGETED_TESTS 13/13 PASS')
          PY
          for script in ubs modules/lib/ubs-common.sh modules/ubs-*.sh scripts/*.sh; do bash -n "$script"; done
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          shellcheck ubs modules/ubs-*.sh scripts/*.sh > "$RUNNER_TEMP/issue135-lint-after.log" 2>&1 || echo 'ShellCheck diagnostics recorded'
          diff -u "$RUNNER_TEMP/issue135-lint-before.log" "$RUNNER_TEMP/issue135-lint-after.log"
          if test -s "$RUNNER_TEMP/issue135-lint-after.log"; then
            echo 'ISSUE135_LINT unchanged baseline diagnostics'
            tail -50 "$RUNNER_TEMP/issue135-lint-after.log"
          else
            echo 'ISSUE135_LINT PASS'
          fi
          git diff --check
          git diff --stat
      - name: Run broader checks using the recorded commands
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          scripts = json.loads(Path(os.environ['RUNNER_TEMP'], 'issue135-reviewed-steps.json').read_text())
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c',
              scripts['Run broader validation and preserve exact outcomes']], check=True)
          PY
      - name: Publish tested objects and a matching tag without moving main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git diff --check
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          repo = os.environ['GH_REPO']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(endpoint, payload):
              result = subprocess.run(
                  ['gh', 'api', '--method', 'POST', '-H',
                   'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0',
                   f'repos/{repo}/{endpoint}', '--input', '-'],
                  input=json.dumps(payload), text=True, capture_output=True, check=True, timeout=60,
              )
              return json.loads(result.stdout)
          allowed = {
              '.github/workflows/optional-analyzers.yml',
              'modules/helpers/ubs_core/analyzers/ctcompare_js.py',
              'modules/lib/ubs-common.sh', 'scripts/new-module.sh',
              'ubs', 'SHA256SUMS', 'VERSION', 'README.md',
              *[p.as_posix() for p in Path('modules').glob('ubs-*.sh')],
          }
          paths = git('diff', '--name-only').splitlines()
          assert set(paths) <= allowed, set(paths) - allowed
          assert 'modules/helpers/ubs_core/analyzers/ctcompare_js.py' in paths
          assert git('hash-object', 'modules/helpers/ubs_core/analyzers/ctcompare_js.py') == 'a160a9756a79ff16ab1716a0984617e780a4111f'
          assert git('hash-object', '.github/workflows/optional-analyzers.yml') == 'ecd991abf33f51d9e28c908434158bb2c84da1f7'
          entries = []
          for name in paths:
              data = Path(name).read_bytes()
              blob = api('git/blobs', {'content': data.decode('utf-8'), 'encoding': 'utf-8'})
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert blob['sha'] == expected, (name, blob)
              mode = git('ls-files', '-s', '--', name).split()[0]
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
              print(f"ISSUE135_BLOB {name} {blob['sha']}", flush=True)
          parent = git('rev-parse', 'HEAD')
          version = Path('VERSION').read_text().strip()
          tree = api('git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          commit = api('git/commits', {
              'message': f'fix(js): isolate ctcompare operands across boolean boundaries (#135)\n\nResolve quote-aware operand boundaries before sensitivity checks. Preserve\nshape and timing-safe exemptions, inspect later comparisons, and retain\nleft operands and precise locations for multiline operator continuations.\n\nAdd eight registered regressions, refresh the complete checksum chain,\nand align the version pin with v{version}. Restore the validation workflow.\n\nFixes #135',
              'tree': tree['sha'], 'parents': [parent],
          })
          print(f"ISSUE135_CANDIDATE {commit['sha']} PARENT {parent} TREE {tree['sha']}", flush=True)
          tag = api('git/refs', {'ref': f'refs/tags/v{version}', 'sha': commit['sha']})
          assert tag['object']['sha'] == commit['sha'], tag
          print(f"ISSUE135_TAG v{version} {commit['sha']}", flush=True)
          PY
          version="$(cat VERSION)"
          git -c http.userAgent='OpenAI File Downloader, XaiImageApiFetch/1.0' fetch origin "refs/tags/v$version:refs/tags/v$version"
          ./scripts/check-version-tag-drift.sh
