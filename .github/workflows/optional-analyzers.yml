name: Optional Analyzer Coverage

on:
  push:
    branches: [main]
    paths: [.github/workflows/optional-analyzers.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optional-analyzers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep rsync shellcheck
      - name: Prepare the reviewed Ruby analyzer implementation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/Dicklesworthstone/ultimate_bug_scanner/git/blobs/4279e276f13530d4bed87efb305bebe2b4df3c5e --jq .content | base64 -d > modules/helpers/ubs_core/external_tools.py
          gh api repos/Dicklesworthstone/ultimate_bug_scanner/git/blobs/0aef942ef3e76867b26d32edff69a1388013f811 --jq .content | base64 -d > "$RUNNER_TEMP/ruby.patch"
          git apply --check "$RUNNER_TEMP/ruby.patch"
          git apply "$RUNNER_TEMP/ruby.patch"
          git apply <<'PATCH'
          diff --git a/modules/ubs-ruby.sh b/modules/ubs-ruby.sh
          --- a/modules/ubs-ruby.sh
          +++ b/modules/ubs-ruby.sh
          @@ -105,10 +105,10 @@
           
           if [[ "$USE_COLOR" -eq 1 ]]; then
             RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'; BLUE='\033[0;34m'
          -  MAGENTA='\033[0;35m'; CYAN='\033[0;36m'; WHITE='\033[1;37m'; GRAY='\033[0;90m'
          +  MAGENTA='\033[0;35m'; CYAN='\033[0;36m'; WHITE='\033[1;37m'
             BOLD='\033[1m'; DIM='\033[2m'; RESET='\033[0m'
           else
          -  RED=''; GREEN=''; YELLOW=''; BLUE=''; MAGENTA=''; CYAN=''; WHITE=''; GRAY=''
          +  RED=''; GREEN=''; YELLOW=''; BLUE=''; MAGENTA=''; CYAN=''; WHITE=''
             BOLD=''; DIM=''; RESET=''
           fi
           
          PATCH
          python3 scripts/update_checksums.py
      - name: Verify syntax, lint, and checksum chain
        run: |
          for script in ubs modules/lib/ubs-common.sh modules/ubs-*.sh; do bash -n "$script"; done
          shellcheck -S warning ubs modules/ubs-bash.sh modules/ubs-ruby.sh
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
      - name: Test Ruby tools across output, scope, and cache paths
        run: python3 test-suite/shareable/test_ruby_analyzers.py -v
      - name: Test existing external coverage and reports
        run: python3 test-suite/shareable/test_optional_analyzers.py -v
      - name: Test existing cache, selection, and file-counting behavior
        run: |
          cd test-suite
          python3 -m unittest quality.test_cache quality.test_scan_selection quality.test_module_file_counting -v
      - name: Verify checksum regeneration is stable
        run: |
          git diff > "$RUNNER_TEMP/ruby-before.diff"
          python3 scripts/update_checksums.py
          git diff > "$RUNNER_TEMP/ruby-runtime.diff"
          cmp "$RUNNER_TEMP/ruby-before.diff" "$RUNNER_TEMP/ruby-runtime.diff"
      - name: Publish tested Git objects without moving a branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(endpoint, payload):
              result = subprocess.run(['gh', 'api', '--method', 'POST', endpoint, '--input', '-'], input=json.dumps(payload), text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          changed = sorted(set(git('diff', '--name-only').splitlines()) | set(git('ls-files', '--others', '--exclude-standard').splitlines()))
          allowed = {'ubs', 'SHA256SUMS', 'modules/helpers/ubs_core/ruby_scan.py', 'modules/helpers/ubs_core/external_tools.py', 'modules/lib/ubs-common.sh', 'scripts/new-module.sh'}
          allowed.update('modules/ubs-' + lang + '.sh' for lang in ('bash', 'cpp', 'csharp', 'elixir', 'golang', 'java', 'js', 'kotlin', 'python', 'ruby', 'rust', 'swift'))
          if set(changed) != allowed:
              raise SystemExit(f'Unexpected changed paths: {changed}')
          endpoint = 'repos/Dicklesworthstone/ultimate_bug_scanner/git/'
          entries = []
          for path in changed:
              tracked = git('ls-files', '-s', '--', path).split()
              mode = tracked[0] if tracked else '100644'
              sha = api(endpoint + 'blobs', {'encoding':'base64', 'content':base64.b64encode(Path(path).read_bytes()).decode()})['sha']
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          tree = api(endpoint + 'trees', {'base_tree':git('rev-parse', 'HEAD^{tree}'), 'tree':entries})['sha']
          result = {'base_commit':git('rev-parse','HEAD'),'tree_sha':tree,'entries':entries}
          Path(os.environ['RUNNER_TEMP'], 'ruby-tree.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruby-analyzer-verification
          path: |
            ${{ runner.temp }}/ruby-tree.json
            ${{ runner.temp }}/ruby-runtime.diff
          if-no-files-found: ignore
