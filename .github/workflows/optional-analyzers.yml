          +UBS_VERSION="5.4.10"
          --- a/README.md
          +++ b/README.md
          @@ -12 +12 @@
          -[![Version](https://img.shields.io/badge/version-5.4.9-blue.svg)](https://github.com/Dicklesworthstone/ultimate_bug_scanner)
          +[![Version](https://img.shields.io/badge/version-5.4.10-blue.svg)](https://github.com/Dicklesworthstone/ultimate_bug_scanner)
          PATCH
          git apply --unidiff-zero --check "$RUNNER_TEMP/issue135-version.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/issue135-version.patch"
