      - name: Gate the candidate on regressions, syntax, and checksum integrity
        run: |
          PYTHONPATH=modules/helpers python3 - <<'PY'
          import ast
          from pathlib import Path
          from ubs_core.analyzers.ctcompare_js import SELF_TESTS
          ast.parse(Path('modules/helpers/ubs_core/analyzers/ctcompare_js.py').read_text())
          for name, test in SELF_TESTS:
