              print(f"ISSUE135_BLOB {name} {blob['sha']}", flush=True)
          parent = git('rev-parse', 'HEAD')
          tree = api('git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          commit = api('git/commits', {
              'message': 'fix(js): isolate ctcompare operands across boolean boundaries (#135)\n\nBound equality operands using quote-aware delimiter depth before sensitivity\nchecks. Preserve timing-safe and shape exemptions, inspect later boolean\ncomparisons, and report multiline findings only on their comparison line.\n\nAdd seven registered regression tests, refresh the complete checksum chain,\nand align the version pin with v5.4.10. Restore the validation workflow.\n\nFixes #135',
              'tree': tree['sha'], 'parents': [parent],
