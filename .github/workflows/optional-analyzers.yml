              print('PASS', name)
          assert len(SELF_TESTS) == 12
          print('ISSUE135_TARGETED_TESTS 12/12 PASS')
          PY
          for script in ubs modules/lib/ubs-common.sh modules/ubs-*.sh scripts/*.sh; do bash -n "$script"; done
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          shellcheck ubs modules/ubs-*.sh scripts/*.sh > "$RUNNER_TEMP/issue135-lint-after.log" 2>&1 || echo "ShellCheck diagnostics recorded"
          diff -u "$RUNNER_TEMP/issue135-lint-before.log" "$RUNNER_TEMP/issue135-lint-after.log"
          if test -s "$RUNNER_TEMP/issue135-lint-after.log"; then
            echo 'ISSUE135_LINT unchanged baseline diagnostics'
            tail -50 "$RUNNER_TEMP/issue135-lint-after.log"
          else
            echo 'ISSUE135_LINT PASS'
          fi
          git diff --check
          git diff --stat
      - name: Run broader validation and preserve exact outcomes
        run: |
          set +e
          PYTHONPATH=modules/helpers timeout 180 python3 -m ubs_core --self-test > "$RUNNER_TEMP/issue135-core.log" 2>&1
          core_status=$?
          echo "ISSUE135_CORE_SELFTEST_EXIT $core_status"
          tail -100 "$RUNNER_TEMP/issue135-core.log"
          (cd test-suite && timeout 300 bash ./run_all.sh) > "$RUNNER_TEMP/issue135-suite.log" 2>&1
          suite_status=$?
          echo "ISSUE135_FULL_SUITE_EXIT $suite_status"
          tail -100 "$RUNNER_TEMP/issue135-suite.log"
          root="$PWD"
          scratch="$(mktemp -d)"
          (cd "$scratch" && timeout 180 "$root/ubs" --ci --format=json --only=python "$root/modules/helpers/ubs_core/analyzers/ctcompare_js.py") > "$RUNNER_TEMP/issue135-selfscan.log" 2>&1
          scan_status=$?
          echo "ISSUE135_SELFSCAN_EXIT $scan_status"
          tail -100 "$RUNNER_TEMP/issue135-selfscan.log"
          exit 0
      - name: Publish the tested candidate and matching tag without moving main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git diff --check
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          repo = os.environ['GH_REPO']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(endpoint, payload):
              result = subprocess.run(
                  ['gh', 'api', '--method', 'POST', '-H',
                   'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0',
                   f'repos/{repo}/{endpoint}', '--input', '-'],
                  input=json.dumps(payload), text=True, capture_output=True, check=True, timeout=60,
              )
              return json.loads(result.stdout)
          allowed = {
              '.github/workflows/optional-analyzers.yml',
              'modules/helpers/ubs_core/analyzers/ctcompare_js.py',
              'modules/lib/ubs-common.sh', 'scripts/new-module.sh',
              'ubs', 'SHA256SUMS', 'VERSION', 'README.md',
              *[p.as_posix() for p in Path('modules').glob('ubs-*.sh')],
          }
          paths = git('diff', '--name-only').splitlines()
          assert set(paths) <= allowed, set(paths) - allowed
          assert 'modules/helpers/ubs_core/analyzers/ctcompare_js.py' in paths
          assert git('hash-object', 'modules/helpers/ubs_core/analyzers/ctcompare_js.py') == 'c9103f8c5c73281e9c2638f589911c34b931c0f5'
          assert git('hash-object', '.github/workflows/optional-analyzers.yml') == 'ecd991abf33f51d9e28c908434158bb2c84da1f7'
          entries = []
