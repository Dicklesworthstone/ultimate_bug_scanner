name: Python Command Control Flow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/python-command-control-flow.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-flow:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UBS_NO_AUTO_UPDATE: "1"
      UBS_ENABLE_AUTO_UPDATE: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Temporary immutable-blob publication only. The connector publishes
      # each tested tree with a branch-head lease; this job never writes refs.
      - name: Preserve base and validate both functional batches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          import sys
          from pathlib import Path

          def digest(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def get_blob(sha):
              result = subprocess.run(['gh', 'api', f"repos/{os.environ['GH_REPO']}/git/blobs/{sha}"],
                  capture_output=True, text=True, check=True, timeout=90)
              data = base64.b64decode(json.loads(result.stdout)['content'])
              assert digest(data) == sha, sha
              return data

          data = b''.join(get_blob(sha) for sha in (
              'c38500bc75fbd66cab7266accc807f23c2aa227c',
              'a1aa1aae9a893bcc65f9fc257ffd1b472d44b4b8',
              'f54f6f1c23884a35b8ba7f58cd67aed8dcdc39c8'))
          assert digest(data) == 'f8b0efa8e701c206bb6039c95dc69bb9d015d12d'
          bundle = json.loads(lzma.decompress(data))
          source = 'modules/helpers/ubs_core/py_detectors/command_injection.py'
          assert digest(Path(source).read_bytes()) == bundle['base'][source]
          all_tests = {entry['path'] for batch in bundle['batches'] for entry in batch['entries']
                       if entry['path'].startswith('test-suite/quality/test_command_')}
          assert not any(Path(name).exists() for name in all_tests), 'a candidate test already exists'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          artifacts = Path(os.environ['RUNNER_TEMP']) / 'command-publication'
          artifacts.mkdir()
          subprocess.run(['git', 'archive', '--format=tar.gz', '-o', str(artifacts / 'base-source.tar.gz'), 'HEAD'], check=True)
          result_manifest = {'base_commit': head, 'base': {
              name: digest(Path(name).read_bytes()) for name in bundle['base']}, 'batches': []}
          print('FLOW_VALIDATION_BASE', head, flush=True)
          for name, sha in result_manifest['base'].items():
              print('FLOW_BASE_BLOB', name, sha, flush=True)

          for batch, expected_tests in zip(bundle['batches'], (99, 138)):
              # Only the unchanged, reviewed detector and its tests are
              # replayed. Current concurrent helpers keep their exact bytes;
              # their integrity chain is regenerated by the official script.
              apply = ['git', 'apply', '--include=' + source,
                       '--include=test-suite/quality/test_command_*']
              patch = batch['patch'].encode('utf-8')
              subprocess.run(apply + ['--check', '-'], input=patch, check=True)
              subprocess.run(apply + ['-'], input=patch, check=True)
              functional = [entry for entry in batch['entries'] if entry['path'] == source or entry['path'] in all_tests]
              for entry in functional:
                  assert digest(Path(entry['path']).read_bytes()) == entry['sha'], entry
              test_code = (
                  "import unittest; s=unittest.defaultTestLoader.discover('test-suite/quality', "
                  "pattern='test_*command*.py'); r=unittest.TextTestRunner(verbosity=2).run(s); "
                  f"assert r.testsRun == {expected_tests} and r.wasSuccessful() and not r.skipped, "
                  "(r.testsRun, r.failures, r.errors, r.skipped)")
              subprocess.run([sys.executable, '-c', test_code], check=True, timeout=180)
              subprocess.run([sys.executable, 'scripts/update_checksums.py'], check=True, stdout=subprocess.DEVNULL, timeout=120)
              subprocess.run(['bash', 'scripts/verify_checksums.sh'], check=True, timeout=120)
              subprocess.run(['bash', 'scripts/verify_sha256sums.sh'], check=True, timeout=120)
              subprocess.run(['git', 'diff', '--check'], check=True)
              changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
              assert changed <= set(bundle['base']), changed - set(bundle['base'])
              for name in sorted(changed):
                  if name.endswith('.sh') or name == 'ubs':
                      subprocess.run(['bash', '-n', name], check=True)
              snapshots = {entry['path']: Path(entry['path']).read_bytes() for entry in batch['entries']}
              subprocess.run([sys.executable, 'scripts/update_checksums.py'], check=True, stdout=subprocess.DEVNULL, timeout=120)
              assert all(Path(name).read_bytes() == content for name, content in snapshots.items()), 'non-idempotent integrity generation'
              published = []
              for entry in batch['entries']:
                  name = entry['path']
                  content = snapshots[name]
                  response = subprocess.run(['gh', 'api', '--method', 'POST',
                      f"repos/{os.environ['GH_REPO']}/git/blobs", '--input', '-'],
                      input=json.dumps({'content': content.decode('utf-8'), 'encoding': 'utf-8'}),
                      text=True, capture_output=True, check=True, timeout=90)
                  sha = json.loads(response.stdout)['sha']
                  assert sha == digest(content), name
                  published.append(dict(entry, sha=sha))
                  saved = artifacts / batch['label'] / name
                  saved.parent.mkdir(parents=True, exist_ok=True)
                  saved.write_bytes(content)
                  print(batch['label'] + '_BLOB', name, sha, entry['mode'], flush=True)
              result_manifest['batches'].append({'label': batch['label'], 'entries': published, 'tests_passed': expected_tests})
              (artifacts / 'manifest.json').write_text(json.dumps(result_manifest, indent=2), encoding='utf-8')
              print(batch['label'] + '_TESTS_PASS', expected_tests, flush=True)
          subprocess.run([sys.executable, 'test-suite/shareable/test_contract_checksums.py', '-v'], check=True, timeout=180)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-publication
          path: ${{ runner.temp }}/command-publication
          retention-days: 3
