name: Python Command Injection

on:
  push:
    branches: [main]
    paths:
      - modules/helpers/ubs_core/py_detectors/command_injection.py
      - test-suite/quality/test_python_command_injection_dataflow.py
      - test-suite/quality/test_command_control_flow.py
      - test-suite/python/security/command_injection_*.py
      - .github/workflows/python-command-injection.yml
      - ubs
      - SHA256SUMS
  pull_request:
    paths:
      - modules/helpers/ubs_core/py_detectors/command_injection.py
      - test-suite/quality/test_python_command_injection_dataflow.py
      - test-suite/quality/test_command_control_flow.py
      - test-suite/python/security/command_injection_*.py
      - .github/workflows/python-command-injection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-regressions:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UBS_NO_AUTO_UPDATE: "1"
      UBS_ENABLE_AUTO_UPDATE: "0"
      UBS_SKIP_RUST_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Bootstrap validation only. The production commit removes staging and
      # blob publication, restoring read-only permissions. No refs are written.
      - name: Stage reviewed control-flow candidate
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'validate command control-flow candidate')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(git hash-object modules/helpers/ubs_core/py_detectors/command_injection.py)" = ccb29797e9e2b6e52f3a122da2be41f1ed75dde7
          echo "FLOW_VALIDATION_BASE $(git rev-parse HEAD)"
          gh api "repos/$GH_REPO/git/blobs/eb1b0c3f88b88aa19fd6f095f94424fbffea1e7b" --jq .content | base64 --decode > "$RUNNER_TEMP/command-flow-candidate.xz"
          python3 - <<'PY'
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          from pathlib import Path
          data = (Path(os.environ['RUNNER_TEMP']) / 'command-flow-candidate.xz').read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == 'eb1b0c3f88b88aa19fd6f095f94424fbffea1e7b'
          candidate = json.loads(lzma.decompress(data))
          subprocess.run(['git', 'apply', '--check', '-'], input=candidate['patch'], text=True, check=True)
          subprocess.run(['git', 'apply', '-'], input=candidate['patch'], text=True, check=True)
          test = Path('test-suite/quality/test_command_control_flow.py')
          assert not test.exists(), 'do not overwrite a concurrent test addition'
          test.write_text(candidate['test'], encoding='utf-8')
          PY
          test "$(git hash-object modules/helpers/ubs_core/py_detectors/command_injection.py)" = a199fce30311ea276cebd05846a5aebc01392bae
          test "$(git hash-object test-suite/quality/test_command_control_flow.py)" = 52c6ede0d5b39a408f834f4de07528f2d3536584
      - name: Install integration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq ripgrep rsync shellcheck
      - name: Test command invocation and control-flow regressions
        run: |
          python3 test-suite/quality/test_python_command_injection_dataflow.py -v
          python3 test-suite/quality/test_command_control_flow.py -v
      - name: Preserve existing positive and negative fixtures
        env:
          PYTHONPATH: modules/helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from ubs_core.py_detectors import command_injection
          clean = Path('test-suite/python/security/command_injection_clean.py')
          buggy = Path('test-suite/python/security/command_injection_buggy.py')
          assert list(command_injection.find([clean])) == [], 'existing clean fixture regressed'
          findings = list(command_injection.find([buggy]))
          assert findings, 'existing buggy fixture lost its findings'
          print('COMMAND_FIXTURES PASS', len(findings), 'positive locations')
          PY
      - name: Generate and verify installation integrity
        run: |
          python3 scripts/update_checksums.py > "$RUNNER_TEMP/command-checksums.log"
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          for script in ubs modules/lib/ubs-common.sh modules/ubs-*.sh scripts/new-module.sh; do bash -n "$script"; done
          git diff --check
      - name: Test real scanner control flow and clean controls
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          root = Path.cwd()
          cases = {
              'keyword-shell': ('import subprocess\nsubprocess.run(args=input(), shell=True)\n', True),
              'branch': ('import os\ncmd = input()\nif flag:\n cmd = "echo"\nos.system(cmd)\n', True),
              'loop': ('import os\ncmd = "echo"\nwhile flag:\n os.system(cmd)\n cmd = input()\n', True),
              'scope-clean': ('import os\ndef first():\n cmd = input()\ndef second(cmd):\n os.system(cmd)\n', False),
              'fixed-argv': ('import subprocess\nsubprocess.run(args=["echo", input()], executable="/bin/echo", shell=False, check=True, timeout=5)\n', False),
          }
          def rules(value):
              if isinstance(value, dict):
                  yield value.get('rule_id', value.get('ruleId', value.get('rule')))
                  for child in value.values():
                      yield from rules(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from rules(child)
          with tempfile.TemporaryDirectory(prefix='ubs-command-integration-') as scratch:
              scratch = Path(scratch)
              for name, (source, expected) in cases.items():
                  project = scratch / name
                  project.mkdir()
                  (project / 'sample.py').write_text(source, encoding='utf-8')
                  result = subprocess.run([str(root / 'ubs'), str(project), '--only=python', '--format=json'],
                      cwd=scratch, env={**os.environ, 'HOME': str(scratch), 'XDG_CACHE_HOME': str(scratch / 'cache')},
                      text=True, capture_output=True, timeout=180)
                  assert result.returncode in (0, 1), (name, result.returncode, result.stdout, result.stderr)
                  payload = json.loads(result.stdout)
                  found = 'py.security.command-injection' in set(rules(payload))
                  assert found == expected, (name, payload, result.stderr)
                  print('COMMAND_REAL_SCAN', name, 'PASS', flush=True)
          PY
      - name: Test checksum generation and installed contract
        run: |
          python3 test-suite/shareable/test_contract_checksums.py -v
          python3 test-suite/shareable/test_installed_contract.py -v
      - name: Publish validated candidate and deterministic integrity blobs
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'validate command control-flow candidate')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          source = 'modules/helpers/ubs_core/py_detectors/command_injection.py'
          test = 'test-suite/quality/test_command_control_flow.py'
          allowed = {'ubs', 'SHA256SUMS', 'modules/lib/ubs-common.sh', 'scripts/new-module.sh', source, test}
          allowed.update(str(path) for path in Path('modules').glob('ubs-*.sh'))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) | {test}
          assert {source, test, 'ubs', 'SHA256SUMS', 'modules/lib/ubs-common.sh'} <= changed <= allowed, changed
          snapshots = {name: Path(name).read_bytes() for name in changed}
          subprocess.run(['python3', 'scripts/update_checksums.py'], check=True, stdout=subprocess.DEVNULL)
          assert all(Path(name).read_bytes() == data for name, data in snapshots.items()), 'non-deterministic checksums'
          for name in sorted(changed):
              data = snapshots[name]
              response = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/git/blobs", '--input', '-'],
                  input=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}),
                  text=True, capture_output=True, check=True, timeout=90)
              sha = json.loads(response.stdout)['sha']
              assert sha == hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              entry = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()
              mode = entry[0] if entry else '100644'
              print('FLOW_BLOB', name, sha, mode, flush=True)
          PY
