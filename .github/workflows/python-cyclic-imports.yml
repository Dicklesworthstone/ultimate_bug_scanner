name: Python Interprocedural Dataflow

on:
  push:
    branches: [main]
    paths:
      - modules/helpers/ubs_core/analyzers/taint_py.py
      - modules/helpers/ubs_core/registry.py
      - modules/helpers/ubs_core/suppression.py
      - modules/helpers/ubs_core/py_scan.py
      - modules/lib/ubs-common.sh
      - modules/ubs-python.sh
      - test-suite/quality/test_taint_python_*.py
      - test-suite/quality/test_suppression_intervals.py
      - test-suite/quality/test_findings*.py
      - test-suite/manifest.json
      - ubs
      - SHA256SUMS
      - .github/workflows/python-cyclic-imports.yml
  pull_request:
    paths:
      - modules/helpers/ubs_core/analyzers/taint_py.py
      - modules/helpers/ubs_core/registry.py
      - modules/helpers/ubs_core/suppression.py
      - modules/helpers/ubs_core/py_scan.py
      - modules/lib/ubs-common.sh
      - modules/ubs-python.sh
      - test-suite/quality/test_taint_python_*.py
      - test-suite/quality/test_suppression_intervals.py
      - test-suite/quality/test_findings*.py
      - test-suite/manifest.json
      - ubs
      - SHA256SUMS
      - .github/workflows/python-cyclic-imports.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-interprocedural-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      UBS_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      UBS_TAINT_E2E: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native scanner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep rsync shellcheck
          npm install --global @ast-grep/cli
      - name: Verify committed runtime before execution
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/python-dataflow-head.txt"
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
      - name: Exercise committed Python dataflow and real CLI paths
        run: |
          set -o pipefail
          python3 -m unittest discover -s test-suite/quality -p 'test_taint_python_*.py' -v 2>&1 | tee "$RUNNER_TEMP/python-dataflow-tests.log"
          python3 -m unittest discover -s test-suite/quality -p 'test_suppression_intervals.py' -v 2>&1 | tee "$RUNNER_TEMP/python-dataflow-suppression.log"
          python3 -m unittest discover -s test-suite/quality -p 'test_findings*.py' -v 2>&1 | tee "$RUNNER_TEMP/python-dataflow-findings.log"
          python3 test-suite/run_manifest.py --case python-taint-buggy --case python-taint-clean 2>&1 | tee "$RUNNER_TEMP/python-dataflow-manifest.log"
      - name: Enforce syntax, lint and deterministic integrity closure
        run: |
          for script in ubs modules/lib/ubs-common.sh scripts/new-module.sh modules/ubs-*.sh; do bash -n "$script"; done
          shellcheck -S warning ubs modules/lib/ubs-common.sh scripts/new-module.sh modules/ubs-*.sh
          ./scripts/update_checksums.sh
          ./scripts/update_sha256sums.sh
          git diff --exit-code
          git diff --check
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-dataflow-${{ github.sha }}
          path: ${{ runner.temp }}/python-dataflow-*
          retention-days: 7
