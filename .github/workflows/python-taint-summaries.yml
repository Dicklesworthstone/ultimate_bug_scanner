name: Python Taint Summary Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/python-taint-summaries.yml
      - test-suite/patches/python-taint-expressions.patch
  workflow_dispatch:

# Validate an exact incremental patch over the landed implementation. This job
# stores tested Git objects only: it never changes a branch or tag.
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UBS_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install scanner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep rsync shellcheck python3-yaml python3-jsonschema
          npm install --global @ast-grep/cli
      - name: Check current base and apply the reviewed incremental patch
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          scratch = Path(os.environ['RUNNER_TEMP'])
          source = Path('modules/helpers/ubs_core/analyzers/taint_py.py')
          patch = Path('test-suite/patches/python-taint-expressions.patch')
          print('TAINT_BASE', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), flush=True)
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '5904fb09f83501a8fd3bef2c2e36e9b145e5b1fd181df4cab25ed1e2942bc081'
          actual = subprocess.check_output(['git', 'hash-object', str(source)], text=True).strip()
          original = '4d9f3848eb1f999ea553b91987642d983718f1d5'
          candidate = 'db1903210787528f7017793e8a5d5c2cfa7f9e9f'
          assert actual in {original, candidate}, f'Refusing to overwrite concurrent analyzer changes: {actual}'
          scripts = ['ubs', 'modules/lib/ubs-common.sh', 'scripts/new-module.sh', *map(str, sorted(Path('modules').glob('ubs-*.sh')))]
          lint = subprocess.run(['shellcheck', '-S', 'warning', *scripts], text=True, capture_output=True)
          (scratch / 'taint-lint-before.log').write_text(lint.stdout + lint.stderr)
          if actual == original:
              before = subprocess.run(['python3', '-m', 'unittest', 'test_taint_python_expressions', '-v'],
                                      env=dict(os.environ, PYTHONPATH='test-suite/quality'), text=True, capture_output=True)
              (scratch / 'taint-before.log').write_text(before.stdout + before.stderr)
              print(before.stdout + before.stderr, flush=True)
              assert before.returncode != 0
              assert 'FAIL: test_annotation_only_does_not_assign_a_clean_value' in before.stderr
              assert 'FAIL: test_subprocess_executable_override_is_a_separate_sink' in before.stderr
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '106c22cbc29fa499bfc52abfc835d8701f6ede08f9cd09099de0cf56285ed2f8'
          compile(source.read_bytes(), str(source), 'exec')
          PY
          ./scripts/update_checksums.sh
          ./scripts/update_sha256sums.sh
      - name: Run source regressions, original self-tests, and actual scanner
        run: |
          UBS_TAINT_E2E=1 python3 -m unittest discover -s test-suite/quality -p 'test_taint_python_*.py' -v
          PYTHONPATH=modules/helpers python3 - <<'PY'
          from ubs_core.analyzers.taint_py import SELF_TESTS
          for name, test in SELF_TESTS:
              test()
              print('LEGACY_SELFTEST_PASS', name)
          PY
          test -f test-suite/quality/test_suppression_intervals.py
          test -f test-suite/quality/test_ubs_core.py
          python3 -m unittest discover -s test-suite/quality -p test_suppression_intervals.py -v
          python3 -m unittest discover -s test-suite/quality -p test_ubs_core.py -v
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          cases = json.loads(Path('test-suite/manifest.json').read_text())['cases']
          selected = [case['id'] for case in cases if case.get('enabled', True)
                      and ('python' in case['id'] or case['id'].startswith('py-'))
                      and 'taint' in json.dumps(case).lower()]
          assert selected, 'No existing Python taint manifest cases found'
          print('TAINT_MANIFEST_CASES', selected, flush=True)
          args = ['python3', 'test-suite/run_manifest.py']
          for name in selected:
              args.extend(['--case', name])
          subprocess.run(args, check=True)
          PY
      - name: Verify the complete checksum closure and store tested blobs
        run: |
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          scratch = Path(os.environ['RUNNER_TEMP'])
          scripts = ['ubs', 'modules/lib/ubs-common.sh', 'scripts/new-module.sh', *map(str, sorted(Path('modules').glob('ubs-*.sh')))]
          for script in scripts:
              subprocess.run(['bash', '-n', script], check=True)
          lint = subprocess.run(['shellcheck', '-S', 'warning', *scripts], text=True, capture_output=True)
          text = lint.stdout + lint.stderr
          (scratch / 'taint-lint-after.log').write_text(text)
          before = (scratch / 'taint-lint-before.log').read_text()
          assert sorted(re.findall(r'\bSC\d+\b', text)) == sorted(re.findall(r'\bSC\d+\b', before)), 'ShellCheck diagnostic codes changed'
          subprocess.run(['git', 'diff', '--check'], check=True)
          diff = subprocess.check_output(['git', 'diff'])
          (scratch / 'taint-tested.diff').write_bytes(diff)
          subprocess.run(['./scripts/update_checksums.sh'], check=True)
          subprocess.run(['./scripts/update_sha256sums.sh'], check=True)
          assert subprocess.check_output(['git', 'diff']) == diff, 'Checksum generation is not idempotent'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          allowed = set(scripts) | {'SHA256SUMS', 'modules/helpers/ubs_core/analyzers/taint_py.py'}
          assert changed <= allowed, changed - allowed
          for name in sorted(changed):
              data = Path(name).read_bytes()
              payload = json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'})
              result = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/git/blobs", '--input', '-'],
                                      input=payload, text=True, capture_output=True, check=True, timeout=90)
              sha = json.loads(result.stdout)['sha']
              assert sha == hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              print('TAINT_INCREMENTAL_TESTED_BLOB', mode, name, sha, flush=True)
          print('TAINT_INCREMENTAL_VALIDATION_PASS', flush=True)
          PY
      - name: Package tracked source and diagnostics
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/taint-source-head.txt"
          git ls-files -s > "$RUNNER_TEMP/taint-source-index.txt"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/taint-source-snapshot.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-taint-incremental-validation
          path: |
            ${{ runner.temp }}/taint-source-*
            ${{ runner.temp }}/taint-*.log
            ${{ runner.temp }}/taint-*.diff
          retention-days: 3
