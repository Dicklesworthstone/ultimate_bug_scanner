name: Python Taint Summary Validation

on:
  push:
    branches: [main]
    paths: [.github/workflows/python-taint-summaries.yml]
  workflow_dispatch:

# Preparation only: store verified Git blobs; never update a branch or tag.
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      UBS_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep rsync shellcheck python3-yaml python3-jsonschema
          npm install --global @ast-grep/cli
      - name: Record baseline and validate both reviewed implementation stages
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          scratch = Path(os.environ['RUNNER_TEMP'])
          source = Path('modules/helpers/ubs_core/analyzers/taint_py.py')
          print('TAINT_BASE', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), flush=True)
          for line in Path('.beads/issues.jsonl').read_text().splitlines():
              bead = json.loads(line)
              if bead.get('status') in {'open', 'in_progress'}:
                  print('OPEN_BEAD', bead['id'], bead.get('priority'), bead['title'], flush=True)
                  if any(word in bead['title'].lower() for word in ('taint', 'dataflow')):
                      print(bead.get('description', ''), flush=True)

          def command(args, **kwargs):
              print('RUN', ' '.join(map(str, args)), flush=True)
              return subprocess.run(args, check=True, **kwargs)

          def blob(sha, digest):
              payload = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/git/blobs/{sha}"], text=True))
              assert payload['encoding'] == 'base64', payload
              data = base64.b64decode(payload['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha, (actual, sha)
              assert hashlib.sha256(data).hexdigest() == digest
              return data

          lint_args = ['shellcheck', '-S', 'warning', 'ubs', 'modules/lib/ubs-common.sh', *map(str, sorted(Path('modules').glob('ubs-*.sh')))]
          lint_before = subprocess.run(lint_args, text=True, capture_output=True)
          (scratch / 'taint-lint-before.log').write_text(lint_before.stdout + lint_before.stderr)
          expected_original = '015bab0cb85ff614ac22b2bf45dc759be82242a7'
          original = subprocess.check_output(['git', 'hash-object', str(source)], text=True).strip()
          assert original == expected_original, original
          baseline = subprocess.run(['python3', '-m', 'unittest', 'test_taint_python_dataflow.SanitizerDomainTests.test_html_escaping_is_not_sql_command_or_eval_sanitization', '-v'],
                                    env=dict(os.environ, PYTHONPATH='test-suite/quality'), text=True, capture_output=True)
          (scratch / 'taint-before.log').write_text(baseline.stdout + baseline.stderr)
          print(baseline.stdout + baseline.stderr, flush=True)
          assert baseline.returncode != 0 and 'FAIL: test_html_escaping_is_not_sql_command_or_eval_sanitization' in baseline.stderr

          source.write_bytes(blob('e1ba1b65fad0b2f06aaad04c450f6846fba507bc', '87db9606ff53b24986089d21faecb9fbc1f176b5a6de8dd3a8545bbab944fe09'))
          cases = json.loads(Path('test-suite/manifest.json').read_text())['cases']
          selected = [case['id'] for case in cases if case.get('enabled', True)
                      and ('python' in case['id'] or case['id'].startswith('py-'))
                      and 'taint' in json.dumps(case).lower()]
          assert selected, 'No existing Python taint manifest cases found'
          manifest = ['python3', 'test-suite/run_manifest.py']
          for name in selected:
              manifest.extend(['--case', name])
          print('TAINT_MANIFEST_CASES', selected, flush=True)
          allowed = {'ubs', 'SHA256SUMS', 'modules/lib/ubs-common.sh', str(source)}
          allowed.update(map(str, Path('modules').glob('ubs-*.sh')))

          for stage in (1, 2):
              if stage == 2:
                  patch = scratch / 'taint-summary.patch'
                  patch.write_bytes(blob('370ee09b7c0479238b6f368338bcfde39fd3c5cc', '85222634f663786a5589de542b1674bbe384ae846057e3c97acffa27d71ab92e'))
                  assert hashlib.sha256(source.read_bytes()).hexdigest() == '87db9606ff53b24986089d21faecb9fbc1f176b5a6de8dd3a8545bbab944fe09'
                  command(['git', 'apply', '--unidiff-zero', '--check', str(patch)])
                  command(['git', 'apply', '--unidiff-zero', str(patch)])
                  assert hashlib.sha256(source.read_bytes()).hexdigest() == 'cc800e864e1b0340d600eb6219dccb9cf28cd403f8f0083e1d701cf613ea0c6a'
              compile(source.read_bytes(), str(source), 'exec')
              command(['./scripts/update_checksums.sh'])
              command(['./scripts/update_sha256sums.sh'])
              pattern = 'test_taint_python_dataflow.py' if stage == 1 else 'test_taint_python_*.py'
              command(['python3', '-m', 'unittest', 'discover', '-s', 'test-suite/quality', '-p', pattern, '-v'],
                      env=dict(os.environ, UBS_TAINT_E2E='1'))
              command(['python3', '-c', 'from ubs_core.analyzers.taint_py import SELF_TESTS; [(test(), print("LEGACY_SELFTEST_PASS", name)) for name, test in SELF_TESTS]'],
                      env=dict(os.environ, PYTHONPATH='modules/helpers'))
              for test in ('test_suppression_intervals.py', 'test_ubs_core.py'):
                  assert Path('test-suite/quality', test).is_file(), test
                  command(['python3', '-m', 'unittest', 'discover', '-s', 'test-suite/quality', '-p', test, '-v'])
              command(manifest)
              command(['./scripts/verify_checksums.sh'])
              command(['./scripts/verify_sha256sums.sh'])
              for script in ('ubs', 'modules/lib/ubs-common.sh', *map(str, Path('modules').glob('ubs-*.sh'))):
                  command(['bash', '-n', script])
              lint_after = subprocess.run(lint_args, text=True, capture_output=True)
              lint_text = lint_after.stdout + lint_after.stderr
              (scratch / f'taint-lint-stage{stage}.log').write_text(lint_text)
              assert sorted(re.findall(r'\bSC\d+\b', lint_text)) == sorted(re.findall(r'\bSC\d+\b', lint_before.stdout + lint_before.stderr)), 'ShellCheck diagnostics changed'
              command(['git', 'diff', '--check'])
              diff = subprocess.check_output(['git', 'diff'])
              (scratch / f'taint-stage{stage}.diff').write_bytes(diff)
              command(['./scripts/update_checksums.sh'])
              command(['./scripts/update_sha256sums.sh'])
              assert subprocess.check_output(['git', 'diff']) == diff, 'Checksum generation is not idempotent'
              changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
              assert changed <= allowed and str(source) in changed, changed
              for name in sorted(changed):
                  data = Path(name).read_bytes()
                  payload = json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'})
                  response = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/git/blobs", '--input', '-'],
                                            input=payload, text=True, capture_output=True, check=True, timeout=90)
                  sha = json.loads(response.stdout)['sha']
                  assert sha == hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
                  print(f'TAINT{stage}_TESTED_BLOB', mode, name, sha, flush=True)
              print('TAINT_STAGE_PASS', stage, flush=True)
          PY
      - name: Package source and diagnostics
        if: always()
        run: |
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/taint-source-snapshot.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-taint-summary-validation
          path: |
            ${{ runner.temp }}/taint-source-snapshot.tar.gz
            ${{ runner.temp }}/taint-*.log
            ${{ runner.temp }}/taint-*.diff
          retention-days: 3
