name: Rust Redirect Dataflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rust-redirect-dataflow.yml
      - modules/helpers/ubs_core/rust_detectors/open_redirect.py
      - modules/helpers/ubs_core/rust_detectors/redirect_flow.py
      - modules/helpers/ubs_core/analyzers/taint_rust.py
      - test-suite/quality/test_rust_redirect_dataflow.py
      - test-suite/quality/test_suppression_intervals.py
      - ubs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UBS_NO_AUTO_UPDATE: '1'
      UBS_SKIP_RUST_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real scanner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep rsync shellcheck rustc
          npm install --global @ast-grep/cli
      # The detector landed in-tree; this job now regresses the landed code.
      - name: Verify integrity chain
        run: |
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
      - name: Run dataflow and real JSON/SARIF regressions
        env:
          UBS_RUST_REDIRECT_E2E: '1'
        run: |
          set -o pipefail
          python3 test-suite/quality/test_rust_redirect_dataflow.py -v 2>&1 | tee "$RUNNER_TEMP/rust-redirect-tests.log"
      - name: Verify existing Rust and cross-language suppression behavior
        run: |
          set -o pipefail
          python3 test-suite/quality/test_suppression_intervals.py -v 2>&1 | tee "$RUNNER_TEMP/rust-suppression-tests.log"
          python3 test-suite/quality/test_rust_test_intervals.py -v 2>&1 | tee "$RUNNER_TEMP/rust-interval-tests.log"
      - name: Verify shell syntax
        run: |
          shellcheck -S warning ubs modules/lib/ubs-common.sh scripts/new-module.sh modules/ubs-*.sh
          for file in ubs modules/lib/ubs-common.sh scripts/new-module.sh modules/ubs-*.sh; do bash -n "$file"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-redirect-dataflow-validation
          path: |
            ${{ runner.temp }}/rust-*.log
            test-suite/artifacts/rust-redirect-dataflow
          retention-days: 3
