name: UBS Test Suite

# Full run_all.sh (every gate, 447 manifest cases in one process). PRs get the
# faster gate in ci.yml (sharded manifest, harness, installer, self-scan);
# this runs on main pushes, nightly, and on demand.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: test-suite-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  bench:
    # Nightly/main benchmark (bead C1): scripts/bench.sh on the fixture tree and
    # the synthetic 50K-line corpus, three runs each; scripts/bench_cusum.py
    # compares against benchmarks/baseline.json (a maintainer copies a
    # latest.json recorded on THIS runner class there to start; a baseline from
    # another machine is meaningless). The results land in a bot PR so the
    # history accumulates in git.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    env:
      NO_COLOR: "1"
      UBS_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep time

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.45.3 >/dev/null

      - name: Run the benchmark corpus
        run: scripts/bench.sh --runs=3

      - name: Compare against the baseline (CUSUM)
        run: python3 scripts/bench_cusum.py --baseline benchmarks/baseline.json --history benchmarks/history.ndjson --latest benchmarks/latest.json

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: benchmarks/

      - name: Open or update the benchmark PR
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            benchmarks/latest.json
            benchmarks/history.ndjson
          branch: bot/bench-refresh
          delete-branch: true
          commit-message: "chore(bench): record benchmark results"
          title: "chore(bench): record benchmark results"
          body: |
            `scripts/bench.sh --runs=3` on the CI runner. Merge to keep the history;
            copy `benchmarks/latest.json` to `benchmarks/baseline.json` to (re)set the
            CUSUM baseline for this runner class.

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      UBS_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify checksums (early fail if stale)
        run: |
          echo "Verifying SHA256SUMS integrity..."
          ACTUAL_UBS=$(sha256sum ubs | awk '{print $1}')
          ACTUAL_INSTALL=$(sha256sum install.sh | awk '{print $1}')
          EXPECTED_UBS=$(grep '  ubs$' SHA256SUMS 2>/dev/null | awk '{print $1}' || echo "")
          EXPECTED_INSTALL=$(grep '  install.sh$' SHA256SUMS 2>/dev/null | awk '{print $1}' || echo "")

          FAIL=0
          if [[ "$ACTUAL_UBS" != "$EXPECTED_UBS" ]]; then
            echo "::error::ubs checksum mismatch (expected $EXPECTED_UBS, got $ACTUAL_UBS)"
            FAIL=1
          fi
          if [[ "$ACTUAL_INSTALL" != "$EXPECTED_INSTALL" ]]; then
            echo "::error::install.sh checksum mismatch (expected $EXPECTED_INSTALL, got $ACTUAL_INSTALL)"
            FAIL=1
          fi

          if [[ "$FAIL" -eq 1 ]]; then
            echo ""
            echo "SHA256SUMS is out of sync! Run: ./scripts/update_checksums.sh"
            exit 1
          fi
          echo "All checksums verified!"

      - name: Set up uv with caching
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep
      - name: Install ast-grep (npm)
        run: npm install -g @ast-grep/cli@0.45.3 >/dev/null

      - name: Install toon_rust encoder (tru)
        # The toon-format-* manifest cases validate real TOON encoding, which
        # needs the toon_rust reference encoder on PATH (default probe: `tru`).
        # Pinned release + sha256 sidecar verification.
        run: |
          TOON_RUST_TAG="v0.2.4"
          curl -fsSLO "https://github.com/Dicklesworthstone/toon_rust/releases/download/${TOON_RUST_TAG}/toon-linux-amd64.tar.xz"
          curl -fsSLO "https://github.com/Dicklesworthstone/toon_rust/releases/download/${TOON_RUST_TAG}/toon-linux-amd64.tar.xz.sha256"
          sha256sum -c <(awk '{print $1"  toon-linux-amd64.tar.xz"}' toon-linux-amd64.tar.xz.sha256)
          tar -xf toon-linux-amd64.tar.xz
          sudo install -m 0755 toon /usr/local/bin/tru
          rm -f toon toon-linux-amd64.tar.xz toon-linux-amd64.tar.xz.sha256
          tru --version

      - name: Sync Python dependencies
        run: uv sync --locked --python 3.14

      - name: Run full test suite
        env:
          NO_COLOR: "1"
          UBS_NO_AUTO_UPDATE: "1"
          UBS_LOG_JSON: "1"
        run: ./test-suite/run_all.sh
