name: TypeScript Module Assignments

on:
  push:
    branches: [main]
    paths:
      - test-suite/patches/typescript-module-assignments.patch.xz
      - test-suite/patches/typescript-module-objects.patch
      - test-suite/patches/typescript-method-receivers.patch.xz
      - test-suite/patches/javascript-namespace-receivers.patch.xz
      - test-suite/patches/javascript-bound-functions.patch
      - test-suite/patches/javascript-bound-arguments.patch.xz
      - .github/workflows/typescript-module-assignments.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-assignments:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UBS_NO_AUTO_UPDATE: '1'
      UBS_TAINT_E2E: '1'
      UBS_HEAP_E2E: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retain exact current source for independent reproduction
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/ts-assignment-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/ts-assignment-source-head.txt"
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-assignment-current-source
          path: ${{ runner.temp }}/ts-assignment-source*
          retention-days: 7
      - name: Apply only tests and reproduce current-engine detection gaps
        run: |
          python3 - <<'PY'
          import hashlib
          import lzma
          import os
          from pathlib import Path
          import subprocess
          expected = {'modules/helpers/ubs_core/analyzers/taint_js.py':'5204d6753adc1a47f9336a5baeee1e826d89c878',
                      'modules/helpers/ubs_core/js_modules.py':'524fc9f292258f96d89ab5dbd1ae5875585556f3'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == sha, path
          patch = lzma.decompress(Path('test-suite/patches/typescript-module-assignments.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'c87483898a61440d1e05156fa192d0852dd38164af25d57bc03640912206e03d'
          Path(os.environ['RUNNER_TEMP'],'ts-assignments.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--include=test-suite/quality/test_taint_ts_module_assignments.py','-'],input=patch,check=True)
          PY
          python3 - <<'PY'
          import importlib.util
          import unittest
          path = 'test-suite/quality/test_taint_ts_module_assignments.py'
          spec = importlib.util.spec_from_file_location('ts_assignment_regressions',path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          names = ('test_import_assignment_connects_source_return',
                   'test_export_assignment_reads_the_end_of_module_binding',
                   'test_exported_object_callable_members_are_resolved')
          suite = unittest.TestSuite(module.TypeScriptModuleAssignments(name) for name in names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert len(result.failures) == 3 and not result.errors and not result.skipped, result
          PY
      - name: Apply reviewed interface and receiver stages and rebuild current integrity
        run: |
          git apply --include=modules/helpers/ubs_core/js_modules.py --include=modules/helpers/ubs_core/analyzers/taint_js.py "$RUNNER_TEMP/ts-assignments.patch"
          test "$(git hash-object modules/helpers/ubs_core/js_modules.py)" = 655db0dc63f9dca9d614eb0a78420881120db658
          test "$(git hash-object test-suite/quality/test_taint_ts_module_assignments.py)" = 3eb4992a35cc8e86607b164f19c4ee12189654ed
          python3 - <<'PY'
          import hashlib
          import lzma
          from pathlib import Path
          import subprocess
          patch = Path('test-suite/patches/typescript-module-objects.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'c22b065028ef53586d5cff6fa210caf1aad7588232ab04e25344762fcee5197e'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          expected = {'modules/helpers/ubs_core/analyzers/taint_js.py':'9c3422c89048ee444a4ffaaaedde0b86579b2035',
                      'modules/helpers/ubs_core/js_modules.py':'764207cc4ba0693eb84eedc33504c0299f8c5d42',
                      'test-suite/quality/test_taint_ts_module_assignments.py':'21151e97f3030457875ef7aa3f77c5d4d5edbb37'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == sha, path
          patch = lzma.decompress(Path('test-suite/patches/typescript-method-receivers.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '946ec951493a73f2b7f7aa52f079722e7a098419570aa3ebfb32418762f44764'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          expected = {'modules/helpers/ubs_core/analyzers/taint_js.py':'235de180a7ec2d09b8b82c89ab9bb0c184b07546',
                      'modules/helpers/ubs_core/js_modules.py':'1ad147dafb5cb6b0509c1703b6773ea701f8b92b',
                      'test-suite/quality/test_taint_ts_module_assignments.py':'9bc922f343d7419f12db5896da00390eecf095d0'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == sha, path
          PY
          python3 scripts/update_checksums.py
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          git diff --check
      - name: Apply live namespace receiver semantics without changing source selection
        run: |
          python3 - <<'PY'
          import hashlib
          import lzma
          from pathlib import Path
          import subprocess
          patch = lzma.decompress(Path('test-suite/patches/javascript-namespace-receivers.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'b4091bc4903902dfc75cbfca38b61e37bfbae0d64bbedc4eac726ecda746e2ed'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          expected = {'modules/helpers/ubs_core/analyzers/taint_js.py':'f3199145ccf7a43b6b40010888e10fa7a4f56b01',
                      'test-suite/quality/test_taint_ts_module_assignments.py':'785f40c0dcb596ae94ab1b082ea78078ac59743c'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == sha, path
          PY
          python3 scripts/update_checksums.py
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          git diff --check
      - name: Apply bound callback values and single-evaluation argument handling
        run: |
          python3 - <<'PY'
          import hashlib
          import lzma
          from pathlib import Path
          import subprocess
          stages = (
              ('javascript-bound-functions.patch',
               '5c221d157ebcb4499819c49575267c94e79a7e68950f3449acbe79d2fae7f1ea',
               '479c1509b516a7c359f379209911156925404c2d',
               '68c7a7c5a064c2c9fa3401967bb8f9cae10b34ec'),
              ('javascript-bound-arguments.patch.xz',
               'e2c0e36d07498bd89708b7a3cf87f2e7a589b3894c52cabc2ade69c2afd5659f',
               '7cc57de24ebddc2999ec65e97de2b612d2f76239',
               'a74afa7436e3f3c85986b8ff738e9e188183549c'),
          )
          for name, digest, source_sha, test_sha in stages:
              patch = Path('test-suite/patches', name).read_bytes()
              if name.endswith('.xz'):
                  patch = lzma.decompress(patch)
              assert hashlib.sha256(patch).hexdigest() == digest, name
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
              expected = {'modules/helpers/ubs_core/analyzers/taint_js.py':source_sha,
                          'test-suite/quality/test_taint_ts_module_assignments.py':test_sha}
              for path, sha in expected.items():
                  assert subprocess.check_output(['git','hash-object',path],text=True).strip() == sha, path
          PY
          python3 scripts/update_checksums.py
          ./scripts/verify_checksums.sh
          ./scripts/verify_sha256sums.sh
          git diff --check
      - name: Install actual scanner and independent compiler controls
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep rsync shellcheck
          npm install --global @ast-grep/cli typescript@5.8.3
      - name: Validate module assignments and existing cross-file cases without skips
        run: |
          python3 - <<'PY'
          import importlib.util
          import unittest
          for path in ('test-suite/quality/test_taint_ts_module_assignments.py',
                       'test-suite/quality/test_taint_js_modules.py',
                       'test-suite/quality/test_taint_js_commonjs.py'):
              spec = importlib.util.spec_from_file_location('regressions',path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
              assert result.wasSuccessful() and not result.skipped, (path,result.failures,result.errors,result.skipped)
              print('TS_ASSIGNMENT_TEST_PASS',path,result.testsRun,flush=True)
          PY
      - name: Preserve current analyzer and installation contracts
        run: |
          python3 -m unittest discover -s test-suite/quality -p 'test_taint_js_value_kinds.py' -v
          python3 -m unittest discover -s test-suite/quality -p 'test_taint_js_property_names.py' -v
          python3 -m unittest discover -s test-suite/quality -p 'test_taint_js_scan_cost.py' -v
          python3 -m unittest discover -s test-suite/shareable -p 'test_contract_checksums.py' -v
          for file in ubs modules/ubs-*.sh modules/lib/ubs-common.sh scripts/new-module.sh; do bash -n "$file"; done
      - name: Retain verified runtime bytes without repository writes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile
          added = 'test-suite/quality/test_taint_ts_module_assignments.py'
          changed = sorted(set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) | {added})
          required = {added,'modules/helpers/ubs_core/js_modules.py','modules/helpers/ubs_core/analyzers/taint_js.py'}
          allowed = required | {'ubs','SHA256SUMS','modules/lib/ubs-common.sh','scripts/new-module.sh'}
          allowed.update(str(p) for p in Path('modules').glob('ubs-*.sh'))
          assert required <= set(changed) <= allowed, changed
          before = {name:Path(name).read_bytes() for name in changed}
          subprocess.run(['python3','scripts/update_checksums.py'],check=True)
          assert changed == sorted(set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) | {added})
          assert all(Path(name).read_bytes() == data for name,data in before.items())
          for command in (['./scripts/verify_checksums.sh'],['./scripts/verify_sha256sums.sh'],['git','diff','--check']):
              subprocess.run(command,check=True)
          manifest = []
          with tarfile.open(Path(os.environ['RUNNER_TEMP'],'ts-assignment-verified.tar.gz'),'w:gz') as archive:
              for name,data in before.items():
                  sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  mode = '100755' if Path(name).stat().st_mode & 0o111 else '100644'
                  manifest.append({'path':name,'sha':sha,'mode':mode})
                  archive.add(name,arcname=name)
          Path(os.environ['RUNNER_TEMP'],'ts-assignment-verified.json').write_text(json.dumps(manifest,indent=2))
          print('TS_ASSIGNMENT_BASE',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-module-assignment-validation
          path: |
            ${{ runner.temp }}/ts-assignment-verified*
            test-suite/artifacts/
          retention-days: 7
